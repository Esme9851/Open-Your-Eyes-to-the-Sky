<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>睁开双眼是天空</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/fonts/smiley-sans.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:"Smiley Sans","得意黑","Noto Serif SC","Source Han Serif SC","Songti SC",sans-serif;}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
#stage{position:relative;width:2560px;height:1440px;flex:none;transform-origin:center center;background:#000;overflow:hidden;}
#scenes{position:absolute;inset:0;}
.page{position:absolute;inset:0;overflow:hidden;}
.asset{position:absolute;user-select:none;-webkit-user-drag:none;display:block;pointer-events:none;}

.txt{position:absolute;color:#fff;font-size:58px;line-height:1.9;letter-spacing:0;
  text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.55);
  pointer-events:none;user-select:none;word-break:break-word;}
.txt p{margin:0;text-indent:2em;font-size:0;letter-spacing:0;}
.txt p.no-indent{text-indent:0;}
.txt.clickable{pointer-events:auto;cursor:pointer;}

#ui{position:absolute;inset:0;z-index:8000;pointer-events:none;}
.navbtn{position:absolute;width:360px;height:360px;padding:0;border:none;
  background:transparent center/contain no-repeat;cursor:pointer;opacity:.82;
  transition:opacity .2s,transform .18s;outline:none;pointer-events:auto;}
.navbtn:hover{opacity:1;}
.navbtn:active{transform:scale(.94);}
#btnLeft{left:70px;bottom:-80px;}
#btnRight{right:70px;bottom:-80px;}
#btnCenter{left:50%;top:50%;transform:translate(-50%,-50%);width:720px;height:720px;display:none;}
#btnCenter:hover{transform:translate(-50%,-50%) scale(1.04);}
#btnCenter:active{transform:translate(-50%,-50%) scale(.96);}
.navbtn.hidden{display:none!important;}

.eyelid{position:absolute;left:0;width:100%;height:51%;z-index:9000;
  pointer-events:none;background-color:#04060d;background-repeat:no-repeat;
  background-size:100% auto;transition:transform .5s cubic-bezier(.62,0,.38,1);will-change:transform;}
#lidTop{top:0;transform:translateY(-101%);background-image:url("上眼皮.png");background-position:top center;}
#lidBottom{bottom:0;transform:translateY(101%);background-image:url("下眼皮.png");background-position:bottom center;}
#lidTop.closed{transform:translateY(0);}
#lidBottom.closed{transform:translateY(0);}
#lidTop.slow, #lidBottom.slow{transition-duration:1.1s;}

#debugBtn{position:fixed;right:16px;bottom:16px;z-index:99999;width:48px;height:48px;
  border-radius:50%;border:none;background:rgba(90,90,160,.65);color:#fff;font-size:15px;
  font-family:sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;
  user-select:none;transition:background .2s;letter-spacing:1px;}
#debugBtn:hover{background:rgba(120,120,200,.9);}
#debugBtn.on{background:rgba(255,180,0,.95);color:#222;font-weight:bold;}

#debugPanel{position:fixed;right:16px;top:16px;z-index:99998;width:300px;
  max-height:calc(100vh - 100px);overflow-y:auto;background:rgba(20,20,35,.94);color:#e8e8f0;
  border:1px solid rgba(255,180,0,.5);border-radius:10px;padding:14px 16px;
  font-family:Consolas,Monaco,monospace;font-size:13px;line-height:1.6;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.6);}
#debugPanel.on{display:block;}
#debugPanel::-webkit-scrollbar{width:6px;}
#debugPanel::-webkit-scrollbar-thumb{background:rgba(255,180,0,.3);border-radius:3px;}
#debugPanel .title{font-weight:bold;color:#ffb400;font-size:14px;margin-bottom:10px;letter-spacing:1px;}
#debugPanel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;}
#debugPanel .row .k{color:#8fa0c0;flex:none;min-width:56px;font-size:12px;}
#debugPanel .row .v{color:#c8d8ff;text-align:right;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
#debugPanel input[type=number],#debugPanel input[type=color],#debugPanel select,#debugPanel textarea{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,180,0,.35);border-radius:5px;
  color:#ffd880;font-family:inherit;font-size:12px;padding:3px 6px;outline:none;}
#debugPanel input[type=number]{width:70px;}
#debugPanel input[type=color]{width:44px;height:24px;padding:0;cursor:pointer;}
#debugPanel select{width:110px;cursor:pointer;}
#debugPanel textarea{width:100%;resize:vertical;min-height:52px;margin-top:4px;line-height:1.5;}
#debugPanel .section-title{color:#ffb400;font-size:12px;margin-top:10px;margin-bottom:6px;
  letter-spacing:1px;border-top:1px solid rgba(255,180,0,.2);padding-top:8px;}
#debugPanel .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;}
#debugPanel .btns button{padding:7px 4px;border-radius:6px;border:1px solid rgba(255,180,0,.4);
  background:rgba(255,180,0,.12);color:#ffd880;cursor:pointer;font-family:inherit;font-size:12px;
  transition:background .15s;}
#debugPanel .btns button:hover{background:rgba(255,180,0,.3);}
#debugPanel .btns button.danger{border-color:rgba(255,90,90,.5);background:rgba(255,90,90,.12);color:#ff9090;}
#debugPanel .btns button.danger:hover{background:rgba(255,90,90,.3);}
#debugPanel .hint{margin-top:10px;font-size:11px;color:#8090a8;line-height:1.5;
  border-top:1px solid rgba(255,180,0,.2);padding-top:8px;}


#toast{position:fixed;left:50%;top:30px;transform:translateX(-50%);
  background:rgba(30,30,45,.95);color:#ffd880;padding:10px 24px;border-radius:8px;
  font-family:Consolas,monospace;font-size:14px;z-index:99999;
  border:1px solid rgba(255,180,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.on{opacity:1;}

.swipe-hint{position:absolute;right:180px;top:32%;transform:translateY(-50%);
  color:rgba(255,255,255,.92);font-size:48px;letter-spacing:.2em;
  text-shadow:0 4px 30px rgba(0,0,0,.85);font-weight:bold;
  display:flex;align-items:center;gap:20px;
  animation:swipePulse 1.6s ease-in-out infinite;pointer-events:none;}
@keyframes swipePulse{
  0%,100%{transform:translate(0,-50%);opacity:.65;}
  50%{transform:translate(-24px,-50%);opacity:1;}
}
.swipe-hint .arrow{font-size:64px;}

.music-close{
  position:absolute;right:40px;top:40px;z-index:8500;
  width:64px;height:64px;border-radius:50%;
  background:rgba(20,20,40,.65);border:2px solid rgba(255,255,255,.55);
  color:#fff;font-size:32px;font-family:sans-serif;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .15s;
  backdrop-filter:blur(6px);
  pointer-events:auto;
}
.music-close:hover{background:rgba(90,90,160,.85);}
.music-close:active{transform:scale(.9);}

.swipe-slider{
  --thumb-size: 84px;
  -webkit-appearance:none;appearance:none;
  width:100%;height:16px;
  background:transparent;
  border-radius:8px;outline:none;cursor:pointer;
  box-shadow:none;
}
.swipe-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:var(--thumb-size);height:var(--thumb-size);border-radius:0;
  background:url("滑杆图标.png") center/contain no-repeat;
  border:none;
  margin-top:calc((16px - var(--thumb-size)) / 2);
  cursor:grab;
  transition:width .18s cubic-bezier(.34,1.56,.64,1),
             height .18s cubic-bezier(.34,1.56,.64,1),
             margin-top .18s cubic-bezier(.34,1.56,.64,1);
}
.swipe-slider::-webkit-slider-thumb:active{cursor:grabbing;}
@keyframes thumbSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.swipe-slider.spinning::-webkit-slider-thumb{
  animation: thumbSpin 2.4s linear infinite;
}
.swipe-slider.spinning::-moz-range-thumb{
  animation: thumbSpin 2.4s linear infinite;
}
.swipe-slider::-moz-range-thumb{
  width:var(--thumb-size);height:var(--thumb-size);border-radius:0;
  background:url("滑杆图标.png") center/contain no-repeat;
  border:none;cursor:grab;
  transition:width .18s cubic-bezier(.34,1.56,.64,1),
             height .18s cubic-bezier(.34,1.56,.64,1);
}
.slider-label{
  position:absolute;left:50%;bottom:130px;transform:translateX(-50%);
  color:rgba(220,230,255,.75);font-size:26px;letter-spacing:.4em;
  text-shadow:0 2px 20px rgba(0,0,0,.8);pointer-events:none;
}

/* ---- 朋友圈长页面 ---- */
#eggScroll{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  pointer-events:auto;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
#eggScroll::-webkit-scrollbar{width:10px;}
#eggScroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:5px;}

.eggInner{position:relative;width:2560px;margin:0 auto;background:#e8e9ec;}
.eggBg{
  position:absolute;left:0;top:0;
  width:2560px;height:auto;display:block;
  pointer-events:none;user-select:none;-webkit-user-drag:none;
}

/* ---- 朋友圈热区（透明按钮层）---- */
.egg-hotspot{
  position:absolute;
  background:transparent;
  pointer-events:auto;
  cursor:pointer;
  transition:background .18s ease, box-shadow .18s ease, border-radius .18s ease;
  border-radius:6px;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-drag:none;
}
.egg-hotspot[data-hs-type="avatar"]:hover,
.egg-hotspot[data-hs-type="photo"]:hover{
  background:rgba(255,255,255,.10);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);
}
.egg-hotspot[data-hs-type="like"]:hover{
  background:rgba(230,74,94,.14);
  border-radius:40px;
}
.egg-hotspot[data-hs-type="like"].liked{
  background:rgba(230,74,94,.18);
  box-shadow:0 0 28px rgba(230,74,94,.5), inset 0 0 0 2px rgba(230,74,94,.6);
  border-radius:40px;
}

#lightbox{position:absolute;inset:0;z-index:9500;background:rgba(0,0,0,.92);
  display:none;align-items:center;justify-content:center;cursor:zoom-out;}
#lightbox.on{display:flex;}
#lightbox img{max-width:88%;max-height:88%;object-fit:contain;border-radius:14px;}

#profileSheet{
  position:fixed;inset:0;z-index:9800;
  background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center;
}
#profileSheet.on{display:flex;}
.pf-inner{
  position:relative;
  width:900px;max-height:80vh;overflow:auto;
  background:#fff;border-radius:20px;padding:40px;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  color:#1a1a2e;
  font-family:"Smiley Sans","得意黑",sans-serif;
}
.pf-close{
  position:absolute;right:20px;top:14px;
  font-size:44px;color:#999;cursor:pointer;line-height:1;
}
.pf-close:hover{color:#333;}
.pf-head{display:flex;align-items:center;gap:20px;margin-bottom:24px;}
.pf-head img{width:120px;height:120px;border-radius:16px;object-fit:cover;}
.pf-name{font-size:40px;font-weight:bold;color:#3a4a7a;}
.pf-count{font-size:26px;color:#888;margin-top:6px;}
.pf-item{padding:20px 0;border-top:1px solid #eee;}
.pf-item-text{font-size:30px;line-height:1.6;white-space:pre-wrap;}
.pf-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.pf-photos img{width:100%;border-radius:8px;object-fit:cover;}
.pf-empty{font-size:28px;color:#999;text-align:center;padding:40px 0;}

/* ---- 进度条 ---- */
#progressBar{
  position:absolute;
  left:50%;bottom:20px;transform:translateX(-50%);
  width:1450px;
  display:flex;align-items:center;gap:22px;
  padding:0 32px;
  background:transparent;
  border-radius:0;
  z-index:8500;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease;
}
#progressBar.visible{
  pointer-events:auto;
  opacity:1;
}
#progressRange{
  -webkit-appearance:none;appearance:none;
  flex:1;height:193px;
  background:url("进度条.png") center/100% 100% no-repeat;
  border:none;outline:none;
  cursor:pointer;
  box-shadow:none;
}
#progressRange::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:110px;height:110px;border-radius:0;
  background:url("电动车.png") center/contain no-repeat;
  border:none;
  box-shadow:none;
  cursor:pointer;
  margin-top:40px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.55));
}
#progressRange::-moz-range-thumb{
  width:110px;height:110px;border-radius:0;
  background:url("电动车.png") center/contain no-repeat;
  border:none;
  box-shadow:none;
  cursor:pointer;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.55));
}
#progressLabel{
  color:#e8eaff;font-size:22px;font-family:Consolas,monospace;
  min-width:120px;text-align:right;letter-spacing:1px;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  user-select:none;
}
/* ---- 地图窗口（第六屏）---- */
.map-window{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  overflow:hidden;
  border-radius:20px;
  background:#1a1a2e;
  cursor:grab;
  pointer-events:auto;
  z-index:50;
}
.map-window.grabbing{cursor:grabbing;}
.map-window img{
  position:absolute;left:0;top:0;
  user-select:none;-webkit-user-drag:none;
  pointer-events:none;
  max-width:none;
}
/* ---------- 序言卡 ---------- */
@font-face{
  font-family:"Yozai";
  src:url("Yozai-Medium.ttf") format("truetype");
  font-display:swap;
}
.prologue-char{
  display:inline-block;
  transition:transform .25s ease, color .3s ease;
  cursor:default;
  will-change:transform;
}
.prologue-char.hovered{
  animation:charFloat .8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes charFloat{
  0%   { transform:translateY(0)     rotate(0deg);   color:#1a1a2e; }
  30%  { transform:translateY(-14px) rotate(8deg);   color:#3a4a7a; }
  60%  { transform:translateY(-6px)  rotate(-5deg);  color:#3a4a7a; }
  100% { transform:translateY(0)     rotate(0deg);   color:#1a1a2e; }
}
.prologue-word{
  display:inline-block;
  cursor:pointer;
  transform-origin:center bottom;
}
.prologue-word.hovered{
  animation:wordFloat .9s cubic-bezier(.34,1.56,.64,1);
}
@keyframes wordFloat{
  0%   { transform:translateY(0)     rotate(0deg); }
  25%  { transform:translateY(-14px) rotate(6deg); }
  55%  { transform:translateY(-6px)  rotate(-4deg); }
  80%  { transform:translateY(-2px)  rotate(2deg); }
  100% { transform:translateY(0)     rotate(0deg); }
}
.prologue-word .prologue-char{
  display:inline-block;
}
/* ★ 序言卡提示文字的悬停抖动 */
.hint-char{
  display:inline-block;
  cursor:default;
  transition:color .3s ease;
  will-change:transform;
}
.hint-char.hovered{
  animation:hintCharFloat .8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes hintCharFloat{
  0%   { transform:translateY(0)     rotate(0deg);   color:rgba(58,74,122,.85); }
  30%  { transform:translateY(-10px) rotate(6deg);   color:rgba(58,74,122,1);   }
  60%  { transform:translateY(-4px)  rotate(-4deg);  color:rgba(58,74,122,1);   }
  100% { transform:translateY(0)     rotate(0deg);   color:rgba(58,74,122,.85); }
}

/* ---- 彩蛋页热区 ---- */
.egg-hotspot{
  position:absolute;
  background:transparent;
  pointer-events:auto;
  cursor:pointer;
  border-radius:8px;
  transition:background .15s ease, box-shadow .15s ease;
}
.egg-hotspot:hover{
  background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}

/* ---- 失传媒体：悬停出下划线 ---- */
.lost-media-word{
  position:relative;
  display:inline;
  color:#ff69b4;              /* ★ 亮粉色 */
  cursor:pointer;
  pointer-events:auto;
  transition:color .25s ease;
  letter-spacing:0;           /* 重置父级继承的字间距，消除额外的空白 */
}
.lost-media-word::after{
  content:"";
  position:absolute;
  left:0; bottom:-4px;
  width:100%; height:3px;
  background:currentColor;
  border-radius:2px;
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.lost-media-word:hover{color:#ff9cc9;}     /* ★ 悬停时更亮的粉色 */
.lost-media-word:hover::after{transform:scaleX(1);}

/* ---- 失传媒体：介绍卡片 ---- */
.lost-media-card{
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%) scale(.92);
  width:1080px;
  max-height:900px;
  overflow-y:auto;
  padding:60px 80px;
  background:rgba(250,248,255,.98);
  border-radius:32px;
  box-shadow:0 40px 120px rgba(60,40,120,.45),
             0 0 0 2px rgba(180,150,255,.35);
  color:#2c2445;
  font-family:"Yozai","悠哉字体","Smiley Sans","得意黑",sans-serif;
  font-size:32px;
  line-height:1.85;
  text-align:left;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease, transform .45s cubic-bezier(.22,.9,.3,1);
  z-index:500;
}
.lost-media-card.on{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}
.lost-media-card::-webkit-scrollbar{width:8px;}
.lost-media-card::-webkit-scrollbar-thumb{background:rgba(120,90,220,.35);border-radius:4px;}

.lost-media-card .lm-close{
  position:absolute;
  right:26px; top:20px;
  width:52px; height:52px;
  border-radius:50%;
  border:none;
  background:rgba(120,90,220,.1);
  color:#5b4a95;
  font-size:32px;
  line-height:1;
  cursor:pointer;
  transition:background .2s;
  display:flex; align-items:center; justify-content:center;
}
.lost-media-card .lm-close:hover{background:rgba(120,90,220,.25);}

.lost-media-card .lm-title{
  font-size:52px;
  letter-spacing:.25em;
  text-align:center;
  margin-bottom:36px;
  color:#4a3a80;
  font-weight:bold;
}

.lost-media-card .lm-img{
  display:block;
  width:100%;
  max-height:340px;
  object-fit:contain;
  margin:0 auto 36px;
  border-radius:12px;
}

.lost-media-card .lm-body p{
  margin:0 0 22px;
  text-indent:2em;
}
.lost-media-card .lm-body p:last-child{margin-bottom:0;}
/* ---- 通用文字悬浮抖动 ---- */
.txt p .float-char{
  display:inline-block;
  font-size:var(--txt-fs, 58px);   /* ★ 用变量恢复字号 */
  transition:transform .25s ease, color .3s ease;
  letter-spacing:0;
  margin:0;
  padding:0;
  vertical-align:top;
}
.txt p .float-char.float-hovered{
  animation:floatCharAnim .8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes floatCharAnim{
  0%   { transform:translateY(0)     rotate(0deg); }
  30%  { transform:translateY(-14px) rotate(8deg); }
  60%  { transform:translateY(-6px)  rotate(-5deg); }
  100% { transform:translateY(0)     rotate(0deg); }
}
/* 空格不参与抖动 */
.txt p .float-char.space{
  pointer-events:none;
}
/* ★ 弧形文字的悬停抖动 */
.arc-char{
  display:inline-block;
  pointer-events:auto;
  cursor:default;
  transition:transform .3s ease, color .3s ease;
  will-change:transform;
}
.arc-char.hovered{
  animation:arcCharFloat .8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes arcCharFloat{
  0%   { transform:translateY(0)     rotate(0deg);   color:#fff; }
  30%  { transform:translateY(-14px) rotate(8deg);   color:#ffe9a0; }
  60%  { transform:translateY(-6px)  rotate(-5deg);  color:#ffe9a0; }
  100% { transform:translateY(0)     rotate(0deg);   color:#fff; }
}
/* ★ 水滴涟漪 */
.droplet-ripple{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid rgba(180,225,255,.9);
  box-shadow:0 0 18px rgba(160,215,255,.6),
             inset 0 0 8px rgba(200,235,255,.5);
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
  will-change:transform,opacity;
  z-index:5;
}

/* ★ 水滴白线拖尾 */
.drip-tail{
  position:absolute;
  left:50%;
  bottom:100%;
  transform:translateX(-50%);
  width:2px;
  height:90px;
  background:linear-gradient(to top,
    rgba(255,255,255,.95) 0%,
    rgba(220,240,255,.55) 40%,
    rgba(200,225,255,0)   100%);
  border-radius:2px;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease;
  filter:blur(0.4px);
}

<script>
(function(){
'use strict';
/* ================================================================
   基础常量
   ================================================================ */
const W = 2560, H = 1440;
const stage    = document.getElementById('stage');
const scenes   = document.getElementById('scenes');
const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnCenter= document.getElementById('btnCenter');
const lidTop   = document.getElementById('lidTop');
const lidBottom= document.getElementById('lidBottom');
const ICON_OPEN = "url('睁眼.png')";
const ICON_CLOSE= "url('闭眼.png')";

/* ================================================================
   通用工具
   ================================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function placeholder(label){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800">'+
   '<rect width="100%" height="100%" fill="rgba(20,20,40,0.78)" '+
   'stroke="rgba(160,160,220,0.55)" stroke-width="5" stroke-dasharray="18 14"/>'+
   '<text x="50%" y="50%" fill="rgba(200,200,240,0.9)" font-family="sans-serif" '+
   'font-size="52" text-anchor="middle" dominant-baseline="middle">'+esc(label)+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function makeImg(src, style, label){
  const img = document.createElement('img');
  img.className = 'asset'; img.alt = ''; img.draggable = false;
  img.onerror = function(){
    if (this.dataset.fb) return;
    this.dataset.fb = '1';
    this.src = placeholder(label || (src||'').replace(/\.\w+$/,'') || '空白');
  };
  if (src) img.src = src;
  else { img.dataset.fb = '1'; img.src = placeholder(label || '空白'); }
  if (style) for (const k in style) img.style[k] = style[k];
  return img;
}
function makeSched(instant){
  const timers = [];
  return {
    after(ms, fn){
      if (instant){
        try { fn(); } catch(e){ console.error('[instant]', e); }
        return null;
      }
      const t = setTimeout(fn, ms); timers.push(t); return t;
    },
    clear(){ timers.forEach(clearTimeout); timers.length = 0; }
  };
}
function textToHtml(text, noIndent){
  const lines = String(text).split('\n');
  return lines.map(function(line){
    const cls = noIndent ? ' class="no-indent"' : '';
    let html = '';
    for (let i = 0; i < line.length; i++){
      const ch = line[i];
      if (ch === ' '){
        html += '<span class="float-char space">&nbsp;</span>';
      } else {
        html += '<span class="float-char">' + esc(ch) + '</span>';
      }
    }
    return '<p' + cls + '>' + html + '</p>';
  }).join('');
}
function htmlToText(html){
  let s = String(html);
  s = s.replace(/<br\s*\/?>/gi, '\n');
  const paras = [];
  s.replace(/<p[^>]*>([\s\S]*?)<\/p>/gi, function(_, inner){
    paras.push(inner); return '';
  });
  if (paras.length) s = paras.join('\n');
  /* ★ 清掉逐字 span 外壳，只留文字 */
/* 保护白名单内的 span */
const keep = [];
s = s.replace(/<span class="lost-media-word">([\s\S]*?)<\/span>/g,
  function(_, inner){ keep.push(inner); return '\u0001KW' + (keep.length - 1) + '\u0001'; });

/* 剥掉其他所有 span */
s = s.replace(/<span[^>]*>([\s\S]*?)<\/span>/g, '$1');

/* 还原白名单 span */
s = s.replace(/\u0001KW(\d+)\u0001/g,
  function(_, i){ return '<span class="lost-media-word">' + keep[+i] + '</span>'; });
  s = s.replace(/<div class="resize-handle"><\/div>/g, '');
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&nbsp;/g,' ').trimEnd();
}

/* ================================================================
   音频
   ================================================================ */
let transientAudios = [];
const persistentAudios = {};
function playSfx(file, opts){
  opts = opts || {};
  let a;
  try { a = new Audio(file); } catch(e){ return null; }
  a.loop = !!opts.loop;
  a.volume = (opts.volume != null) ? opts.volume : 0.85;
  a.play().catch(function(){});
  if (opts.persistent){
    if (persistentAudios[file]){ try{ persistentAudios[file].pause(); }catch(e){} }
    persistentAudios[file] = a;
  } else transientAudios.push(a);
  return a;
}
function stopPersistent(file){
  if (persistentAudios[file]){ try{ persistentAudios[file].pause(); }catch(e){} delete persistentAudios[file]; }
}
function startCicada(){
  if (musicUserMuted) return;   /* ★ 用户已静音 */
  if (persistentAudios['蝉鸣.mp3']) return;
  playSfx('蝉鸣.mp3', {loop:true, volume:0.55, persistent:true});
  showGuitarBtn();
}
function stopCicada(){ stopPersistent('蝉鸣.mp3'); }

/* ★ 蝉鸣淡出：不是一下子停，而是在 fadeMs 内把音量收到 0 */
let cicadaFadeTimer = null;
function stopCicadaFadeOut(fadeMs){
  const a = persistentAudios['蝉鸣.mp3'];
  if (!a) return;
  fadeMs = (fadeMs == null) ? 2200 : fadeMs;

  /* 已有一个淡出在跑，先清掉 */
  if (cicadaFadeTimer){
    clearInterval(cicadaFadeTimer);
    cicadaFadeTimer = null;
  }

  if (fadeMs <= 0){
    try { a.pause(); } catch(e){}
    delete persistentAudios['蝉鸣.mp3'];
    return;
  }

  const startVol = a.volume;
  const t0 = performance.now();
  cicadaFadeTimer = setInterval(function(){
    /* 中途如果蝉鸣被新的实例替换了，放弃这次淡出 */
    if (persistentAudios['蝉鸣.mp3'] !== a){
      clearInterval(cicadaFadeTimer);
      cicadaFadeTimer = null;
      return;
    }
    const t = (performance.now() - t0) / fadeMs;
    if (t >= 1){
      clearInterval(cicadaFadeTimer);
      cicadaFadeTimer = null;
      try { a.pause(); } catch(e){}
      delete persistentAudios['蝉鸣.mp3'];
      return;
    }
    try { a.volume = Math.max(0, startVol * (1 - t)); } catch(e){}
  }, 40);
}
function stopAllTransient(){
  transientAudios.forEach(function(a){ try{ a.pause(); }catch(e){} });
  transientAudios = [];
}
function playClick(){
  playSfx('点击音效.mp3', {volume:0.6});
}
function startCicadaFadeIn(dur){
  if (musicUserMuted) return;   /* ★ 用户已静音 */
  if (persistentAudios['蝉鸣.mp3']) return;
  const a = playSfx('蝉鸣.mp3', {loop:true, volume:0, persistent:true});
  if (!a) return;
  showGuitarBtn();
  const target = 0.55;
  const t0 = performance.now();
  const iv = setInterval(function(){
    const p = Math.min(1, (performance.now() - t0) / dur);
    try { a.volume = target * p; } catch(e){}
    if (p >= 1) clearInterval(iv);
  }, 50);
}
function shakeScreen(){
  const scale = getStageScale();
  const keys = [[0,0],[80,-14],[160,12],[240,-10],[320,8],[400,-5],[480,0]];
  const t0 = performance.now();
  function step(){
    const e = performance.now() - t0;
    if (e > 500){
      stage.style.transform = 'scale(' + scale + ')';
      return;
    }
    let x = 0;
    for (let i = 0; i < keys.length - 1; i++){
      if (e >= keys[i][0] && e <= keys[i+1][0]){
        const p = (e - keys[i][0]) / (keys[i+1][0] - keys[i][0]);
        x = keys[i][1] + (keys[i+1][1] - keys[i][1]) * p;
        break;
      }
    }
    stage.style.transform = 'scale(' + scale + ') translateX(' + x + 'px)';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
/* ★ 纯上下震动：只晃当前页的背景层，不影响眼皮 */
function shakeScreenVertical(onDone){
  const sc = document.getElementById('scenes');
  if (!sc){ if (onDone) onDone(); return; }

  const keys = [[0,0],[60,-22],[130,18],[210,-14],[290,10],[370,-6],[450,0]];
  const dur = 450;
  const t0 = performance.now();

  function step(){
    const e = performance.now() - t0;
    if (e >= dur){
      /* 彻底归位 */
      sc.style.transform = '';
      /* ★ 通知调用方：震动真真正正结束了 */
      if (onDone) onDone();
      return;
    }
    let y = 0;
    for (let i = 0; i < keys.length - 1; i++){
      if (e >= keys[i][0] && e <= keys[i+1][0]){
        const p = (e - keys[i][0]) / (keys[i+1][0] - keys[i][0]);
        y = keys[i][1] + (keys[i+1][1] - keys[i][1]) * p;
        break;
      }
    }
    sc.style.transform = 'translateY(' + y + 'px)';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ================================================================
   吉他（带淡出 + 右上角关闭按钮）
   ================================================================ */
let guitarPlaying = false;
let guitarBtn = null;
let guitarFadeTimer = null;
function startGuitar(){
  if (musicUserMuted) return;   /* ★ 用户已静音 */
  if (guitarPlaying) return;
  if (guitarFadeTimer){ clearInterval(guitarFadeTimer); guitarFadeTimer = null; }
  playSfx('吉他.mp3', {loop:true, volume:0.5, persistent:true});
  guitarPlaying = true;
  showGuitarBtn();
}
function stopGuitar(fadeMs){
  if (!guitarPlaying && !persistentAudios['吉他.mp3']) return;
  fadeMs = (fadeMs == null) ? 1200 : fadeMs;
  const a = persistentAudios['吉他.mp3'];
  guitarPlaying = false;
  if (!a){ return; }
  if (fadeMs <= 0){
    try { a.pause(); } catch(e){}
    delete persistentAudios['吉他.mp3'];
    return;
  }
  const startVol = a.volume;
  const start = performance.now();
  if (guitarFadeTimer) clearInterval(guitarFadeTimer);
  guitarFadeTimer = setInterval(function(){
    const t = (performance.now() - start) / fadeMs;
    if (t >= 1){
      clearInterval(guitarFadeTimer);
      guitarFadeTimer = null;
      try { a.pause(); } catch(e){}
      delete persistentAudios['吉他.mp3'];
      return;
    }
    try { a.volume = Math.max(0, startVol * (1 - t)); } catch(e){}
  }, 40);
}
/* ★ 右上角"关闭音乐"按钮：任何音乐（BGM / 吉他 / 蝉鸣）在播放时就显示 */
function showGuitarBtn(){
  if (musicUserMuted) return;
  if (guitarBtn) return;
  guitarBtn = document.createElement('button');
  guitarBtn.className = 'music-close';
  guitarBtn.type = 'button';
  guitarBtn.title = '关闭音乐';
  guitarBtn.textContent = '×';
  guitarBtn.addEventListener('click', function(e){
    e.stopPropagation();
    musicUserMuted = true;
    stopBgm(600);
    stopGuitar(0);
    stopCicadaFadeOut(600);
    hideGuitarBtn();
  });
  stage.appendChild(guitarBtn);
}
function hideGuitarBtn(){
  if (guitarBtn){ guitarBtn.remove(); guitarBtn = null; }
}

/* ================================================================
   ★ 全局 BGM：简单.mp3 → 乱序.mp3 → 吉他出现时淡出
   ================================================================ */
const BGM_FULL_VOL = 0.40;

let bgmAudio = null;
let currentBgmFile = null;
let bgmUnlocked = false;
let musicUserMuted = false;   /* ★ 用户点了右上角"关闭音乐"后，全局静音 */

/* ★ 第二段简单.mp3：s8p6 与 s9p1 同音量（0.32），之后逐页递减 */
const REDUCE_STEPS = [
  { sid: 's8',  pg: 6, vol: 0.32 },
  { sid: 's8',  pg: 7, vol: 0.32 },   /* ★ 补上第八屏第 7 页，与 s8p6、s9p1 同音量 */
  { sid: 's9',  pg: 1, vol: 0.32 },
  { sid: 's9',  pg: 2, vol: 0.26 },
  { sid: 's10', pg: 1, vol: 0.20 },
  { sid: 's10', pg: 2, vol: 0.13 },
  { sid: 's11', pg: 1, vol: 0.06 }
];

function fadeTo(audio, targetVol, ms, onDone){
  if (!audio){ if (onDone) onDone(); return; }
  if (audio._fadeTimer){ clearInterval(audio._fadeTimer); audio._fadeTimer = null; }
  if (!ms || ms <= 0){
    try { audio.volume = Math.max(0, Math.min(1, targetVol)); } catch(e){}
    if (onDone) onDone();
    return;
  }
  const startVol = audio.volume;
  const t0 = performance.now();
  audio._fadeTimer = setInterval(function(){
    const t = Math.min(1, (performance.now() - t0) / ms);
    try { audio.volume = startVol + (targetVol - startVol) * t; } catch(e){}
    if (t >= 1){
      clearInterval(audio._fadeTimer);
      audio._fadeTimer = null;
      if (onDone) onDone();
    }
  }, 40);
}

function playBgm(file, targetVol, fadeMs){
  if (!file) return;
  if (musicUserMuted) return;   /* ★ 用户静音后不再启动 */
  if (currentBgmFile === file){
    if (bgmAudio) fadeTo(bgmAudio, targetVol, fadeMs);
    if (targetVol > 0.05) showGuitarBtn();
    return;
  }
  const oldAudio = bgmAudio;
  if (oldAudio){
    fadeTo(oldAudio, 0, fadeMs, function(){
      try { oldAudio.pause(); } catch(e){}
    });
  }
  currentBgmFile = file;
  try {
    const a = new Audio(file);
    a.loop = true;
    a.volume = 0;
    a.play().catch(function(){});
    bgmAudio = a;
    fadeTo(a, targetVol, fadeMs);
    /* ★ 只有音量真正可听时才显示关闭按钮（预启动的 0 音量不显示） */
    if (targetVol > 0.05) showGuitarBtn();
  } catch(e){
    bgmAudio = null;
  }
}

function stopBgm(fadeMs){
  if (!bgmAudio){ currentBgmFile = null; return; }
  const old = bgmAudio;
  bgmAudio = null;
  currentBgmFile = null;
  fadeTo(old, 0, fadeMs, function(){
    try { old.pause(); } catch(e){}
  });
}

/* ★ 每页对应的 BGM：返回 { file, vol } 或 null */
function bgmForPage(idx){
  const item = FLAT[idx];
  if (!item) return null;
  const sid = item.screen.id;
  const pg  = item.pageNo;

  if (sid === 'cover') return null;

  /* 序言卡 ~ 第七屏第 1 页：简单.mp3 */
  if (sid === 'prologue' || sid === 's1' || sid === 's2' || sid === 's3' ||
      sid === 's4'      || sid === 's5' || sid === 's6' ||
      (sid === 's7' && pg === 1)) return { file: '简单.mp3', vol: BGM_FULL_VOL };

  /* 第七屏第 2 页 ~ 第八屏第 5 页：乱序.mp3 */
  if ((sid === 's7' && pg >= 2) || (sid === 's8' && pg <= 5))
    return { file: '乱序.mp3', vol: BGM_FULL_VOL };

  /* 第八屏第 6 页 ~ 第十一屏第 1 页：简单.mp3 按明确音量表逐页递减 */
  for (let i = 0; i < REDUCE_STEPS.length; i++){
    const st = REDUCE_STEPS[i];
    if (st.sid === sid && st.pg === pg){
      return { file: '简单.mp3', vol: st.vol };
    }
  }

  /* 第十一屏第 2 页开始：无 BGM（交给吉他） */
  return null;
}

function updateBgmForPage(idx){
  if (musicUserMuted) return;   /* ★ 用户静音后不再自动切 BGM */
  const target = bgmForPage(idx);
  if (!target){
    if (currentBgmFile !== null) stopBgm(1800);
    return;
  }
  if (target.file === currentBgmFile){
    if (bgmAudio && Math.abs(bgmAudio.volume - target.vol) > 0.02){
      fadeTo(bgmAudio, target.vol, 1600);
    }
    return;
  }
  playBgm(target.file, target.vol, 1600);
}

/* ================================================================
   ★ 悬停替换文字：找到 el 里连续的 findText，悬停时换成 replaceText
   ================================================================ */
function bindHoverReplace(el, findText, replaceText){
  const chars = el.querySelectorAll('.float-char');
  let startIdx = -1;

  /* ★ 标准匹配：逐字比对 */
  for (let i = 0; i <= chars.length - findText.length; i++){
    let match = true;
    for (let j = 0; j < findText.length; j++){
      const ch = chars[i + j].textContent.replace(/\u00A0/g,' ');
      if (ch !== findText[j]){ match = false; break; }
    }
    if (match){ startIdx = i; break; }
  }

  /* ★ 宽松兜底：把全部字符拼成字符串，用 indexOf 找 */
  if (startIdx < 0){
    let full = '';
    const positions = [];
    for (let i = 0; i < chars.length; i++){
      const t = chars[i].textContent.replace(/\u00A0/g,' ');
      positions.push(full.length);
      full += t;
    }
    const idx = full.indexOf(findText);
    if (idx >= 0){
      for (let i = 0; i < positions.length; i++){
        if (positions[i] === idx){ startIdx = i; break; }
      }
    }
  }

  if (startIdx < 0){
    console.warn('[bindHoverReplace] 找不到关键词：', findText,
                 '\n实际文本：', Array.from(chars).map(function(c){return c.textContent;}).join(''));
    return;
  }

  const first  = chars[startIdx];
  const parent = first.parentNode;
  const moved  = [];
  for (let i = 0; i < findText.length; i++) moved.push(chars[startIdx + i]);

  const wrapper = document.createElement('span');
  wrapper.className = 'hover-replace';
  parent.insertBefore(wrapper, first);
  moved.forEach(function(c){ wrapper.appendChild(c); });

  /* ★ 关键修复：替换文本不要 pointer-events:none，
        让它接收鼠标事件，这样鼠标从原文移到替换文本上时，
        wrapper 不会触发 mouseleave */
  let rep = null;

  function show(){
    /* 隐藏原文 */
    moved.forEach(function(c){ c.style.display = 'none'; });

    if (!rep){
      rep = document.createElement('span');
      rep.className = 'hover-replace-text';
      rep.textContent = replaceText;
      wrapper.appendChild(rep);
    }
    rep.style.display = '';
  }

  function hide(){
    moved.forEach(function(c){ c.style.display = ''; });
    if (rep) rep.style.display = 'none';
  }

  /* 初始状态：替换文本隐藏 */
  show();
  hide();

  wrapper.addEventListener('mouseenter', show);
  wrapper.addEventListener('mouseleave', hide);
}

/* ================================================================
   ★ 鼠标拖尾：鼠标移动过的地方冒出字符，随机大小/旋转，淡出
   opt.minGap   — 两次生成之间最少移动多少 px（越大越稀疏）
   opt.cooldown — 两次生成之间最少间隔多少 ms（越大越稀疏）
   opt.life     — 每个字符从出现到消失的时长 ms
   ================================================================ */
function bindMouseTrail(ctx, ch, opt){
  opt = opt || {};
  const minGap   = (opt.minGap   != null) ? opt.minGap   : 90;
  const cooldown = (opt.cooldown != null) ? opt.cooldown : 160;
  const life     = (opt.life     != null) ? opt.life     : 1200;

  let lastX = -9999, lastY = -9999, lastT = 0;

  function handler(e){
    const now = performance.now();
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    if (Math.hypot(dx, dy) < minGap) return;
    if (now - lastT < cooldown) return;
    lastX = e.clientX; lastY = e.clientY; lastT = now;

    /* 换算到舞台坐标系 */
    const scale = getStageScale();
    const stageRect = stage.getBoundingClientRect();
    const x = (e.clientX - stageRect.left) / scale;
    const y = (e.clientY - stageRect.top)  / scale;

    const el = document.createElement('div');
    el.textContent = ch;
    const fs  = 60 + Math.random() * 60;                 /* 字号 60~120 */
    const rot = (Math.random() - 0.5) * 50;              /* 旋转 ±25° */
    el.style.cssText =
      'position:absolute;' +
      'left:' + x + 'px;top:' + y + 'px;' +
      'transform:translate(-50%,-50%) rotate(' + rot + 'deg) scale(.4);' +
      'font-size:' + fs + 'px;color:#ffffff;line-height:1;' +
      'text-shadow:0 4px 24px rgba(0,0,0,.75), 0 0 40px rgba(255,220,120,.55);' +
      'opacity:0;pointer-events:none;user-select:none;' +
      'transition:opacity .3s ease, transform .45s cubic-bezier(.3,1.4,.5,1);' +
      'z-index:40;';
    ctx.root.appendChild(el);

    requestAnimationFrame(function(){
      el.style.opacity = '0.92';
      el.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg) scale(1)';
    });

    setTimeout(function(){
      el.style.transition = 'opacity ' + (life/1000) + 's ease, transform ' + (life/1000) + 's ease';
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%,-90%) rotate(' + rot + 'deg) scale(1.1)';
    }, 380);
    setTimeout(function(){ if (el.parentNode) el.remove(); }, life + 200);
  }

  document.addEventListener('mousemove', handler);
  /* ★ 链式清理：不覆盖已有的 _cleanup */
  const prevCleanup = ctx.root._cleanup;
  ctx.root._cleanup = function(){
    document.removeEventListener('mousemove', handler);
    if (prevCleanup) prevCleanup();
  };
}
/* ================================================================
   ★ 悬停弹出科普卡片：优先放右侧，放不下换左侧，再不行放下方
   ================================================================ */
function bindHoverPopup(el, findText, html){
  const chars = el.querySelectorAll('.float-char');
  let startIdx = -1;

  for (let i = 0; i <= chars.length - findText.length; i++){
    let match = true;
    for (let j = 0; j < findText.length; j++){
      const ch = chars[i + j].textContent.replace(/\u00A0/g, ' ');
      if (ch !== findText[j]){ match = false; break; }
    }
    if (match){ startIdx = i; break; }
  }
  if (startIdx < 0){
    console.warn('[bindHoverPopup] 找不到关键词：', findText);
    return;
  }

  const first  = chars[startIdx];
  const parent = first.parentNode;
  const moved  = [];
  for (let i = 0; i < findText.length; i++) moved.push(chars[startIdx + i]);

  const wrapper = document.createElement('span');
  wrapper.className = 'hover-popup-wrap';
  parent.insertBefore(wrapper, first);
  moved.forEach(function(c){ wrapper.appendChild(c); });

  let card = null;
  let hideTimer = null;

  function cancelHide(){
    if (hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
  }
  function scheduleHide(){
    cancelHide();
    hideTimer = setTimeout(function(){
      if (!card) return;
      const c = card;
      card = null;
      c.classList.remove('on');
      setTimeout(function(){ if (c.parentNode) c.remove(); }, 350);
    }, 220);
  }

  function show(){
    cancelHide();
    if (card) return;

    card = document.createElement('div');
    card.className = 'hover-popup-card';
    card.innerHTML = html;
    document.body.appendChild(card);

    /* 先隐藏但占位，量一下真实尺寸 */
    card.style.visibility = 'hidden';
    card.style.opacity = '1';
    card.style.transition = 'none';

    requestAnimationFrame(function(){
      const cw = card.offsetWidth;
      const ch = card.offsetHeight;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const wr = wrapper.getBoundingClientRect();

      /* ★ 卡片水平居中于"气生根"，底部紧贴其上方 16px */
      let left = wr.left + wr.width / 2 - cw / 2;
      let top  = wr.top - ch - 16;

      /* 水平不能超出屏幕 */
      left = Math.max(20, Math.min(vw - cw - 20, left));
      /* 若卡片高出屏幕顶部，就让顶部贴屏幕顶（绝不改放下方） */
      if (top < 20) top = 20;

      card.style.left = Math.round(left) + 'px';
      card.style.top  = Math.round(top)  + 'px';
      card.style.visibility = '';
      card.style.opacity = '';
      card.style.transition = '';
      card.classList.add('on');
    });

    card.addEventListener('mouseenter', cancelHide);
    card.addEventListener('mouseleave', scheduleHide);
  }

  wrapper.addEventListener('mouseenter', show);
  wrapper.addEventListener('mouseleave', scheduleHide);
}
/* ================================================================
   ★ 光波：鼠标划过关键词时，9 个字依次发光上浮
   （完全不依赖 wrapper 尺寸，用 getBoundingClientRect 判定）
   ================================================================ */
function bindMeteorShower(el, findText){
  const chars = el.querySelectorAll('.float-char');
  let startIdx = -1;

  for (let i = 0; i <= chars.length - findText.length; i++){
    let match = true;
    for (let j = 0; j < findText.length; j++){
      const ch = chars[i + j].textContent.replace(/\u00A0/g,' ');
      if (ch !== findText[j]){ match = false; break; }
    }
    if (match){ startIdx = i; break; }
  }
  if (startIdx < 0){
    let full = '', positions = [];
    for (let i = 0; i < chars.length; i++){
      positions.push(full.length);
      full += chars[i].textContent.replace(/\u00A0/g,' ');
    }
    const idx = full.indexOf(findText);
    if (idx >= 0){
      for (let i = 0; i < positions.length; i++){
        if (positions[i] === idx){ startIdx = i; break; }
      }
    }
  }
  if (startIdx < 0){
    console.warn('[光波] 找不到关键词：', findText);
    return;
  }

  const target = [];
  for (let i = 0; i < findText.length; i++){
    target.push(chars[startIdx + i]);
  }

  let cooldown = 0;

  function fire(){
    const now = performance.now();
    if (now - cooldown < 1200) return;
    cooldown = now;

    target.forEach(function(c, i){
      setTimeout(function(){
        if (!c.isConnected) return;
        c.style.transition = 'color .28s ease, text-shadow .28s ease, transform .28s ease';
        c.style.color = '#ffe9a0';
        c.style.textShadow =
          '0 0 22px rgba(255,230,140,1),' +
          ' 0 0 46px rgba(255,200,80,.75),' +
          ' 0 0 80px rgba(255,180,60,.45)';
        c.style.transform = 'translateY(-12px) scale(1.18)';

        setTimeout(function(){
          if (!c.isConnected) return;
          c.style.color = '';
          c.style.textShadow = '';
          c.style.transform = '';
        }, 500);
      }, i * 70);
    });
  }

  /* ★ 改用 mouseenter 直接绑定到目标字符上，元素移除时自动失效 */
  target.forEach(function(c){
    c.style.pointerEvents = 'auto';
    c.addEventListener('mouseenter', fire);
  });
}


/* ================================================================
   ★ 逐字下落：让 el 里的每个字从上方不同高度、带随机旋转地落下
   ================================================================ */
function dropCharsIn(el, baseDelay, opt){
  opt = opt || {};
  const dyMin   = (opt.dyMin   != null) ? opt.dyMin   : 400;
  const dyMax   = (opt.dyMax   != null) ? opt.dyMax   : 900;
  const step    = (opt.step    != null) ? opt.step    : 110;
  const jitter  = (opt.jitter  != null) ? opt.jitter  : 200;

  const chars = el.querySelectorAll('.float-char');
  chars.forEach(function(c, i){
    const dy  = dyMin + Math.random() * (dyMax - dyMin);
    const rot = (Math.random() - 0.5) * 24;
    c.style.transition = 'none';
    c.style.opacity = '0';
    c.style.transform = 'translateY(-' + dy + 'px) rotate(' + rot + 'deg)';

    const t = baseDelay + i * step + Math.random() * jitter;
    setTimeout(function(){
      c.style.transition =
        'opacity .35s ease, transform 1.2s cubic-bezier(.45,0,.75,.5)';
      c.style.opacity = '1';
      c.style.transform = 'translateY(0) rotate(0deg)';
    }, t);
  });
}

/* ================================================================
   ★ 单句水滴落下：对 el 内的文字做滴水动画；完成时回调 onDone
   ================================================================ */
function dripLineIn(el, opt, onDone){
  opt = opt || {};
  const startDelay   = (opt.startDelay   != null) ? opt.startDelay   : 700;
  const charStep     = (opt.charStep     != null) ? opt.charStep     : 75;
  const jitterMax    = (opt.jitterMax    != null) ? opt.jitterMax    : 1800;
  const dropFromBase = (opt.dropFromBase != null) ? opt.dropFromBase : 200;
  const dropFromVar  = (opt.dropFromVar  != null) ? opt.dropFromVar  : 700;
  const dropDuration = 1100;
  const waveDelay    = 700;
  const waveDuration = 1600;

  el.style.transition = 'none';
  el.style.opacity = '1';

  const chars = el.querySelectorAll('.float-char:not(.space)');

  /* 插入白线拖尾 */
  chars.forEach(function(c){
    c.style.position = 'relative';
    const tail = document.createElement('span');
    tail.className = 'drip-tail';
    const len = 40 + Math.random() * 90;
    tail.style.height = len + 'px';
    const gap = 4 + Math.random() * 14;
    tail.style.bottom = 'calc(100% + ' + gap + 'px)';
    tail.style.width = (1 + Math.random() * 2).toFixed(1) + 'px';
    tail.dataset.alpha = (0.4 + Math.random() * 0.6).toFixed(2);
    c.appendChild(tail);
    c._tail = tail;
  });

  /* 每个字先被推到上方、拉长成"水滴"，全透明 */
  chars.forEach(function(c){
    const dropFrom = dropFromBase + Math.random() * dropFromVar;
    const stretch  = 1.3 + Math.random() * 0.7;
    c.style.transformOrigin = 'center center';
    c.style.transition = 'none';
    c.style.opacity = '0';
    c.style.transform =
      'translateY(-' + dropFrom + 'px) scale(1,' + stretch + ')';
  });

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      const txtRect = el.getBoundingClientRect();
      const scale = getStageScale();
      const positions = [];
      chars.forEach(function(c){
        const r = c.getBoundingClientRect();
        const m = /translateY\(-([\d.]+)px\)/.exec(c.style.transform);
        const offsetY = m ? parseFloat(m[1]) : 0;
        const cx = (r.left + r.width / 2 - txtRect.left) / scale;
        const cy = (r.top  + r.height/ 2 - txtRect.top ) / scale + offsetY;
        positions.push({ x: cx, y: cy });
      });

      const ripples = positions.map(function(p){
        const rip = document.createElement('div');
        rip.className = 'droplet-ripple';
        rip.style.left = p.x + 'px';
        rip.style.top  = p.y + 'px';
        el.appendChild(rip);
        return rip;
      });

      let maxEndTime = 0;
      chars.forEach(function(c, i){
        const delay = startDelay + i * charStep + Math.random() * jitterMax;
        if (delay + dropDuration > maxEndTime) maxEndTime = delay + dropDuration;

        setTimeout(function(){
          /* 白线拖尾 */
          if (c._tail){
            const baseAlpha = parseFloat(c._tail.dataset.alpha) || 0.8;
            const tailDelay = 60 + Math.random() * 200;
            const tailLife  = 180 + Math.random() * 350;
            setTimeout(function(){
              c._tail.style.transition = 'opacity .18s ease';
              c._tail.style.opacity = baseAlpha;
            }, tailDelay);
            setTimeout(function(){
              c._tail.style.transition = 'opacity .55s ease';
              c._tail.style.opacity = '0';
            }, tailDelay + tailLife);
          }

          /* 字符落回原位 */
          c.style.transition =
            'opacity .5s ease, transform 1.1s cubic-bezier(.32,1.35,.4,1)';
          c.style.opacity = '1';
          c.style.transform = 'translateY(0) scale(1,1)';

          /* 涟漪 */
          setTimeout(function(){
            const rip = ripples[i];
            if (rip){
              rip.animate([
                { transform: 'translate(-50%,-50%) scale(0.2)', opacity: 0.85 },
                { transform: 'translate(-50%,-50%) scale(1.0)', opacity: 0.45 },
                { transform: 'translate(-50%,-50%) scale(2.4)', opacity: 0 }
              ], {
                duration: 1300,
                easing: 'cubic-bezier(.2,.8,.4,1)',
                fill: 'forwards'
              });
            }
          }, 700);
        }, delay);
      });

  /* 全部落定后：默认自动做一次水面波动，skipWave 时跳过 */
      const skipWave = !!opt.skipWave;
      setTimeout(function(){
        if (!skipWave){
          chars.forEach(function(c, i){
            c.style.animation =
              'waterWave 1.6s ease-in-out ' + (i * 28) + 'ms 1';
          });
        }
        /* ★ 把 el 和 chars 一并交给回调，方便外层统一做水波 */
        if (onDone){
          if (skipWave){
            onDone(el, chars);
          }else{
            setTimeout(function(){ onDone(el, chars); },
                       waveDuration + 300);
          }
        }
      }, maxEndTime + waveDelay);
    });
  });
}

    if (def.bg.charAt(0) === '#'){
      root.style.background = def.bg;
    } else {
      const bgImg = makeImg(def.bg + '.png',
        {left:'0',top:'0',width:'100%',height:'100%',objectFit:'cover'}, def.bg);
      bgImg.dataset.noDebug = '1';
      root.appendChild(bgImg);
    }
  }

  const ctx = {
    root: root, sched: sched, index: idx, newEid: newEid,
    after: function(ms, fn){ return sched.after(ms, fn); },

    registerAsset: function(el, label){
      if (!el.dataset.eid) el.dataset.eid = newEid('asset', label);
      if (label) el.dataset.label = label;
      return el;
    },

        addImg: function(src, style, label){
      const img = makeImg(src, style, label);
      img.dataset.eid = newEid('img', label);
      ctx.registerAsset(img, label);
      root.appendChild(img);
      return img;
    },

        addText: function(html, opt, delay){
      opt = opt || {};
      const eid = newEid('text', opt.tag);
      const d = document.createElement('div');
      d.className = 'txt';
      d.dataset.eid = eid;
      const noIndent = !!opt.noIndent;
      if (noIndent) d.dataset.noIndent = '1';
      d.innerHTML = textToHtml(html, noIndent);

      const x      = (opt.x != null) ? opt.x : 1280;
      const y      = (opt.y != null) ? opt.y : 720;
      const anchor = opt.anchor || 'center';
      const width  = (opt.width != null) ? opt.width : 1800;
      const fs     = (opt.fontSize != null) ? opt.fontSize : 58;
      d.style.left = x + 'px';
      d.style.top  = y + 'px';
      d.style.width = width + 'px';
      d.style.fontSize = fs + 'px';
      d.style.setProperty('--txt-fs', fs + 'px');
      let tx, align;
      if (anchor === 'left'){ tx = '0'; align = 'left'; }
      else if (anchor === 'right'){ tx = '-100%'; align = 'right'; }
      else { tx = '-50%'; align = 'center'; }
      d.style.transform = 'translate(' + tx + ', -50%)';
      d.style.textAlign = opt.align || align;
      if (opt.color) d.style.color = opt.color;
      if (opt.textShadow != null) d.style.textShadow = opt.textShadow;
      if (opt.lineHeight) d.style.lineHeight = opt.lineHeight;
      if (opt.letterSpacing) d.style.letterSpacing = opt.letterSpacing;
      root.appendChild(d);

        const inMs  = opt.fade ? (opt.fade.inMs  || 350) : 1100;
        const hold  = opt.fade ? (opt.fade.holdMs|| 0)   : 0;
        const outMs = opt.fade ? (opt.fade.outMs || 350) : 0;
        const startDelay = (delay == null ? 150 : delay);
        if (opt.flip){
          d.style.opacity = '0';
          d.style.transform = 'translate(' + tx + ', -50%) perspective(900px) rotateX(-90deg)';
          d.style.transformOrigin = 'center center';
          d.style.transition = 'opacity .5s ease, transform .7s cubic-bezier(.3,1.1,.4,1)';
          sched.after(startDelay, function(){
            d.style.opacity = '1';
            d.style.transform = 'translate(' + tx + ', -50%) perspective(900px) rotateX(0deg)';
          });
        } else {
          d.style.opacity = '0';
          d.style.transition = 'opacity ' + (inMs/1000) + 's ease';
          sched.after(startDelay, function(){
            d.style.opacity = '1';
            if (opt.fade){
              sched.after(inMs + hold, function(){
                d.style.transition = 'opacity ' + (outMs/1000) + 's ease';
                d.style.opacity = '0';
                sched.after(outMs + 50, function(){
                  if (d.parentNode) d.remove();
                });
              });
            }
          });
        }
      return d;
    },

    addLines: function(lines, opt, startDelay, stepMs){
      opt = opt || {};
      startDelay = (startDelay == null) ? 300 : startDelay;
      stepMs    = (stepMs == null) ? 400 : stepMs;
      const baseY = (opt.y != null) ? opt.y : 720;
      const lineGap = opt.lineGap || 130;
      const totalH = (lines.length - 1) * lineGap;
      const startY = baseY - totalH / 2;
      lines.forEach(function(line, i){
        ctx.after(startDelay + i * stepMs, function(){
          const o = Object.assign({}, opt, {y: startY + i * lineGap});
          ctx.addText(line, o, 0);
        });
      });
    }
  };

  if (def.build) def.build(ctx);
  if (typeof ctx.beforeNext === 'function') root._beforeNext = ctx.beforeNext;
  if (def.nextType) root._nextType = def.nextType;
  return root;
}

    function updateTrail(L, sc){

      const leafRadiusVb = (LEAF_W * sc / 2) * (viewBox[2] / W);
      const marginVb     = 30 * (viewBox[2] / W);

      const segStart = Math.min(totalLen, L + leafRadiusVb + marginVb);
      const segEnd   = Math.min(totalLen, segStart + SHOW_LEN);
      const segLen   = Math.max(0, segEnd - segStart);

      pathEl.setAttribute('stroke-dasharray', segLen + ' ' + DASH_BIG);

      /* ★ 箭头位置：显示段前端；若被叶子盖住则推到叶子半径外 */
      let arrowL = segEnd;
      const minArrowL = L + leafRadiusVb + marginVb * 1.4;
      if (arrowL < minArrowL) arrowL = Math.min(totalLen, minArrowL);

      if (L > 0.005 * totalLen && L < totalLen - 4){
        const pt = pathEl.getPointAtLength(arrowL);
        const pA = pathEl.getPointAtLength(Math.max(0, arrowL - 4));
        const pB = pathEl.getPointAtLength(Math.min(totalLen, arrowL + 4));
        const angDeg = Math.atan2(pB.y - pA.y, pB.x - pA.x) * 180 / Math.PI;

    /* 采样 + 曲率 */

    for (let i = 0; i <= SAMPLES; i++){
      const L = totalLen * (i / SAMPLES);
      const pt = pathEl.getPointAtLength(L);
      const pA = pathEl.getPointAtLength(Math.max(0, L - 4));
      const pB = pathEl.getPointAtLength(Math.min(totalLen, L + 4));
      const ang = Math.atan2(pB.y - pA.y, pB.x - pA.x);
      samples.push({ L: L, x: pt.x, y: pt.y, angle: ang, shrink: 1 });
    }
    for (let i = 0; i <= SAMPLES; i++){
      const prev = samples[Math.max(0, i - 8)];
      const curr = samples[i];
      const next = samples[Math.min(SAMPLES, i + 8)];
      let dA = curr.angle - prev.angle;
      let dB = next.angle - curr.angle;
      while (dA >  Math.PI) dA -= 2 * Math.PI;
      while (dA < -Math.PI) dA += 2 * Math.PI;
      while (dB >  Math.PI) dB -= 2 * Math.PI;
      while (dB < -Math.PI) dB += 2 * Math.PI;
      const curva = Math.abs(dA) + Math.abs(dB);
      curr.shrink = Math.max(0.68, 1 - curva * 0.5);
    }

    /* viewBox */
    let viewBox = [0, 0, 1, 1];
    function svgPtToStage(pt){
      const vb = viewBox;
      const rect = svg.getBoundingClientRect();
      const scale = Math.min(rect.width / vb[2], rect.height / vb[3]);
      const offsetX = rect.left + (rect.width  - vb[2] * scale) / 2;
      const offsetY = rect.top  + (rect.height - vb[3] * scale) / 2;
      const screenX = offsetX + (pt.x - vb[0]) * scale;
      const screenY = offsetY + (pt.y - vb[1]) * scale;
      const stageRect = stage.getBoundingClientRect();
      const sScale = getStageScale();
      return {
        x: (screenX - stageRect.left) / sScale,
        y: (screenY - stageRect.top ) / sScale
      };
    }
    function stageToSvgPoint(clientX, clientY){
      const vb = viewBox;
      const rect = svg.getBoundingClientRect();
      const scale = Math.min(rect.width / vb[2], rect.height / vb[3]);
      const offsetX = rect.left + (rect.width  - vb[2] * scale) / 2;
      const offsetY = rect.top  + (rect.height - vb[3] * scale) / 2;
      return {
        x: (clientX - offsetX) / scale + vb[0],
        y: (clientY - offsetY) / scale + vb[1]
      };

    /* ---- 叶子 ---- */
    const LEAF_W = 400;
    const MIN_SCALE = 0.32;

      left:'0', top:'0',

    leaf.style.touchAction = 'none';
    leaf.style.userSelect = 'none';
    leaf.style.webkitUserDrag = 'none';

    let curL = 0;
    let dragging = false;
    let finished = false;
    let autoDriving = false;
    let autoKicked  = false;
    let breatheFactor = 1;   /* ★ 呼吸：1 为常态，1.0x 会周期性变化 */

    /* 末端横放 */
    function getDisplayAngle(rawAngleDeg, progress){
      if (progress < 0.85) return rawAngleDeg;
      const t = (progress - 0.85) / 0.15;
      const s = t * t * (3 - 2 * t);
      let target = 0, best = Infinity;
      const cands = [0, 180, -180, 360, -360];
      for (let k = 0; k < cands.length; k++){
        const d = Math.abs(rawAngleDeg - cands[k]);
        if (d < best){ best = d; target = cands[k]; }
      }
      return rawAngleDeg * (1 - s) + target * s;
    }

    function applyLeafAtL(L){
      if (L < 0) L = 0;
      if (L > totalLen) L = totalLen;
      curL = L;

      const progress = totalLen > 0 ? L / totalLen : 0;
      const idx = Math.min(SAMPLES, Math.max(0, Math.round(progress * SAMPLES)));
      const sp = samples[idx];
      const stagePt = svgPtToStage({ x: sp.x, y: sp.y });

      const grow = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * Math.pow(progress, 3);
      const sc = grow * sp.shrink * breatheFactor;   /* ★ 乘上呼吸因子 */
      const rawDeg = sp.angle * 180 / Math.PI;
      const displayDeg = getDisplayAngle(rawDeg, progress);

      leaf.style.left = stagePt.x + 'px';
      leaf.style.top  = stagePt.y + 'px';
      leaf.style.transform =
        'translate(-50%,-50%) rotate(' + displayDeg + 'deg) scale(' + sc + ')';

      updateTrail(L, sc);

      if (progress > 0.985 && !finished){

        return;
      }

      /* ★ 拖到 2/3 后自动接管，走完剩下的 1/3 */
      if (progress >= 2/3 && !finished && !autoDriving && !autoKicked){
        autoKicked = true;
        startAutoDrive();

    /* ================================================================
       ★ 呼吸提示：等待用户拖动时，叶子轻微起伏
       ================================================================ */
    let breatheRaf = null;
    let breatheT0  = 0;

    function startBreathe(){
      if (breatheRaf) return;
      breatheT0 = performance.now();
      function step(){
        if (finished || dragging || autoDriving){
          breatheRaf = null;
          return;
        }
        const t = (performance.now() - breatheT0) / 900;
        /* 幅度 3.5%，周期 0.9 秒 */
        breatheFactor = 1 + 0.035 * Math.sin(t * Math.PI * 2);
        applyLeafAtL(curL);
        breatheRaf = requestAnimationFrame(step);
      }
      breatheRaf = requestAnimationFrame(step);
    }

    function stopBreathe(){
      if (breatheRaf){
        cancelAnimationFrame(breatheRaf);
        breatheRaf = null;
      }
      breatheFactor = 1;
    }

    /* ================================================================
       ★ 自动接管：把叶子从当前位置推到终点
       ================================================================ */
    function startAutoDrive(){
      if (autoDriving || finished) return;
      stopBreathe();                    /* ★ 停呼吸 */
      autoDriving = true;
      dragging = false;
      leaf.style.cursor = 'default';
      leaf.style.filter = 'drop-shadow(0 4px 10px rgba(0,0,0,.35))';

      const startL = curL;
      const endL   = totalLen;
      const dur    = 1400;   /* 自动走完用 1.4 秒 */
      const t0     = performance.now();

      function step(){
        if (finished) return;
        const t = Math.min(1, (performance.now() - t0) / dur);
        /* ease-in-out：先慢、中段快、最后缓 */

          : 1 - Math.pow(-2 * t + 2, 2) / 2;

        if (t < 1){
          requestAnimationFrame(step);
        } else {
          autoDriving = false;
        }
      }
      requestAnimationFrame(step);
    }

    function findNearestL(svgPt, fromL){
      const range = 300, step = 4;
      let bestL = fromL, bestD = Infinity;
      const endL = Math.min(totalLen, fromL + range);
      for (let L = fromL; L <= endL; L += step){
        const p = pathEl.getPointAtLength(L);
        const d = (p.x - svgPt.x) ** 2 + (p.y - svgPt.y) ** 2;
        if (d < bestD){ bestD = d; bestL = L; }
      }
      return bestL;
    }

    function onPointerDown(e){
      if (finished || autoDriving) return;
      e.preventDefault();
      stopBreathe();                    /* ★ 停呼吸 */

      leaf.style.cursor = 'grabbing';
      leaf.style.filter = 'drop-shadow(0 6px 14px rgba(0,0,0,.5))';
      if (leaf.setPointerCapture && e.pointerId != null){
        try { leaf.setPointerCapture(e.pointerId); } catch(err){}
      }
    }
    function onPointerMove(e){
      if (!dragging || finished || autoDriving) return;
      const svgPt = stageToSvgPoint(e.clientX, e.clientY);
      const nearL = findNearestL(svgPt, curL);
      if (nearL > curL + 0.5){
        applyLeafAtL(nearL);
      }
    }
    function onPointerUp(){
      if (!dragging) return;
      dragging = false;
      leaf.style.cursor = 'grab';
      leaf.style.filter = 'drop-shadow(0 4px 10px rgba(0,0,0,.35))';

    leaf.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    /* 初始化 viewBox + 叶子定位在起点 */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        const bbox = pathEl.getBBox();
        const aspect = W / H;
        const pathAspect = bbox.width / Math.max(1, bbox.height);
        let vbW, vbH, vbX, vbY;
        if (pathAspect > aspect){
          vbW = bbox.width;
          vbH = bbox.width / aspect;
          vbX = bbox.x;
          vbY = bbox.y - (vbH - bbox.height) / 2;
        } else {
          vbH = bbox.height;
          vbW = bbox.height * aspect;
          vbY = bbox.y;
          vbX = bbox.x - (vbW - bbox.width) / 2;
        }
        const padFrac = 0.05;
        vbX -= vbW * padFrac;
        vbY -= vbH * padFrac;
        vbW *= (1 + padFrac * 2);
        vbH *= (1 + padFrac * 2);

        /* ★ 把路径在屏幕空间里整体右移 400px
           （因为 viewBox 会自动适配，直接改路径坐标无效，
            只能反向移动 viewBox 的左边界） */
        vbX -= 400 * (vbW / W);

        viewBox = [vbX, vbY, vbW, vbH];
        svg.setAttribute('viewBox', vbX + ' ' + vbY + ' ' + vbW + ' ' + vbH);

        requestAnimationFrame(function(){
          leaf.style.transition = 'none';
          applyLeafAtL(0);
          leaf.style.transform =
            leaf.style.transform.replace(/scale\([\d.]+\)/, 'scale(0)');
        });
      });
    });

    ctx.after(textEndTime + 1000, function(){
      /* 叶子快速弹出 */
      leaf.style.transition =
        'opacity .35s ease, transform .55s cubic-bezier(.34,1.56,.64,1)';
      leaf.style.opacity = '1';
      applyLeafAtL(0);

      /* ★ 叶子弹出后 400ms，轨迹才淡入 */
      ctx.after(400, function(){
        trailGroup.style.opacity = '1';
        /* ★ 轨迹淡入后再等 400ms，开始呼吸提示 */
        ctx.after(400, function(){
          startBreathe();
        });
      });
    });

    /* ---- 拖到终点 ---- */
    function triggerTransition(){
      if (finished) return;
      finished = true;

      const sp = samples[SAMPLES];
      const stagePt = svgPtToStage({ x: sp.x, y: sp.y });
      const finalScale = MAX_SCALE * 1.8;
      const rawDeg = sp.angle * 180 / Math.PI;
      const displayDeg = getDisplayAngle(rawDeg, 1.0);

      leaf.style.transition =
        'transform 1.2s cubic-bezier(.4,0,.3,1), opacity 1.4s ease 0.5s';
      leaf.style.left = stagePt.x + 'px';
      leaf.style.top  = stagePt.y + 'px';
      leaf.style.transform =
        'translate(-50%,-50%) rotate(' + displayDeg + 'deg) scale(' + finalScale + ')';

      roomLayer.style.opacity = '0';

      });
    }

    /* ---- 天空阶段：1s 后叶子从上方飘入，边旋转边缩小 ---- */
    function phase2(){
      ctx.after(1000, function(){
        const CURVE_D = 'M 900 -320 C 420 200, 1780 480, 1280 720';

        /* 只用来算曲线坐标，不负责显示 */
        const curveSvg = document.createElementNS(SVG_NS, 'svg');
        curveSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        curveSvg.setAttribute('preserveAspectRatio', 'none');
        curveSvg.style.cssText =
          'position:absolute;left:0;top:0;width:0;height:0;' +
          'overflow:hidden;pointer-events:none;';
        ctx.root.appendChild(curveSvg);

        const curvePath = document.createElementNS(SVG_NS, 'path');
        curvePath.setAttribute('d', CURVE_D);
        curvePath.setAttribute('fill', 'none');
        curvePath.setAttribute('stroke', 'none');
        curveSvg.appendChild(curvePath);
        const curveLen = curvePath.getTotalLength();

        /* ★ 叶子直接加到 ctx.root，坐标系与 viewBox 一致，直接用 p.x / p.y */
        const leaf2 = makeImg('叶子.png', {
          left:'0px', top:'0px',
          width: LEAF_W + 'px', height: LEAF_W + 'px', objectFit:'contain',
          transform:'translate(-50%,-50%) scale(3.0)',
          opacity:'0',
          filter:'drop-shadow(0 4px 10px rgba(0,0,0,.35))',
          pointerEvents:'none', zIndex:'61'
        }, '叶子');
        leaf2.style.pointerEvents = 'none';
        ctx.root.appendChild(leaf2);

        const DUR = 3400;
        const START_SCALE_2 = 3.0;
        const END_SCALE_2   = 0.05;
        const t0 = performance.now();
        let shown = false;

        function step(){
          const t = Math.min(1, (performance.now() - t0) / DUR);

          if (t > 0.01 && !shown){
            shown = true;
            leaf2.style.transition = 'opacity .6s ease';
            leaf2.style.opacity = '1';
          }

          const L = t * curveLen;
          const p = curvePath.getPointAtLength(L);
          const pA = curvePath.getPointAtLength(Math.max(0, L - 6));
          const pB = curvePath.getPointAtLength(Math.min(curveLen, L + 6));
          const angle = Math.atan2(pB.y - pA.y, pB.x - pA.x) * 180 / Math.PI;

          /* 缓出：后段缩得更快 */
          const et = 1 - Math.pow(1 - t, 1.6);
          const sc = START_SCALE_2 + (END_SCALE_2 - START_SCALE_2) * et;

          leaf2.style.left = p.x + 'px';
          leaf2.style.top  = p.y + 'px';
          leaf2.style.transform =
            'translate(-50%,-50%) rotate(' + angle + 'deg) scale(' + sc + ')';

          if (t < 1){
            requestAnimationFrame(step);
          } else {
            leaf2.style.transition = 'opacity .5s ease';
            leaf2.style.opacity = '0';
            ctx.after(600, function(){
              if (leaf2.parentNode) leaf2.remove();
              if (curveSvg.parentNode) curveSvg.remove();
              showEnd();
            });
          }
        }
        requestAnimationFrame(step);
      });
    }

    /* ---- 结束：文字出现后不再有叶子 ---- */
    function showEnd(){
      const endEl = document.createElement('div');
      endEl.innerHTML = '不过没关系，<br>现在，天色还早。';

/* ================================================================
   构建并放置一页
   ================================================================ */
function buildAndPlace(idx, keepOld){
  const def = FLAT[idx].def;
  const el = buildPage(idx);
  if (!def.keepPrev && !keepOld){
    const oldPages = scenes.querySelectorAll('.page');
    oldPages.forEach(function(p){
      if (p._sched) p._sched.clear();
      if (p._cleanup) p._cleanup();
      p.remove();
    });
  }
  scenes.appendChild(el);
  currentPageEl = el;
  return el;
}

/* ★ 瞬移跳页：从目标页所在屏的首页开始，顺序构建到目标页 */
function jumpTo(idx){
  if (busy) return;
  if (idx < 0 || idx >= FLAT.length) return;
  busy = true;

  /* 1. 找目标页所在屏的第一页 */
  const targetScreenId = FLAT[idx].screen.id;
  let screenStartIdx = idx;
  while (screenStartIdx > 0 && FLAT[screenStartIdx - 1].screen.id === targetScreenId){
    screenStartIdx--;
  }

  /* ★ 2. 旧页暂时保留在 DOM 里，作为底衬防止黑屏；
        同时打上 data-hidden 标记，让依赖查询跳过它们 */
  const oldPages = Array.prototype.slice.call(scenes.querySelectorAll('.page'));
  oldPages.forEach(function(p){ p.dataset.hidden = '1'; });

  /* 3. 从屏首到目标页，依次 instant 构建（新页叠在旧页上面） */
  const newPages = [];
  let lastEl = null;
  for (let k = screenStartIdx; k <= idx; k++){
    try {
      const pageEl = buildPage(k, true);
      scenes.appendChild(pageEl);
      newPages.push(pageEl);
      lastEl = pageEl;
    } catch(e){
      console.error('[jumpTo build error]', k, e);
    }
  }

  if (!lastEl){
    busy = false;
    return;
  }

  /* ★ 4. 等新页的图片/视频就绪，再移除旧页 —— 防黑闪 */
  let finalized = false;
  function finalize(){
    if (finalized) return;
    finalized = true;

    oldPages.forEach(function(p){
      if (p._sched) p._sched.clear();
      if (p._cleanup) p._cleanup();
      p.remove();
    });

    /* 5. 收尾 */
    cur = idx;
    currentPageEl = lastEl;
    busy = false;
    finishNav(idx);
  }

  /* 收集新页里所有还没加载完的 img 和 video */
  const pending = [];
  newPages.forEach(function(p){
    p.querySelectorAll('img').forEach(function(el){
      if (!el.complete) pending.push(el);
    });
    p.querySelectorAll('video').forEach(function(el){
      if (el.readyState < 2) pending.push(el);
    });
  });

  if (pending.length === 0){
    /* 全部已缓存：两帧后移除旧页即可（保险一点） */
    requestAnimationFrame(function(){
      requestAnimationFrame(finalize);
    });
  } else {
    let count = 0;
    function oneDone(){
      count++;
      if (count >= pending.length) finalize();
    }
    pending.forEach(function(el){
      el.addEventListener('load',       oneDone, {once:true});
      el.addEventListener('loadeddata', oneDone, {once:true});
      el.addEventListener('error',      oneDone, {once:true});
    });
    /* 兜底：最多等 800ms，不让用户干等 */
    setTimeout(finalize, 800);
  }
}
/* ================================================================
   翻页调度
   ================================================================ */
function doNavigate(idx, type){
  if (busy) return;
  if (idx < 0 || idx >= FLAT.length) return;
  busy = true;

  if (!type || type === 'auto'){
    const fromScreen = (cur >= 0 && cur < FLAT.length) ? FLAT[cur].screen.id : null;
    const toScreen = FLAT[idx].screen.id;
    type = (fromScreen === toScreen) ? 'fade' : 'eye';
  }

  const oldTransient = transientAudios;
  transientAudios = [];
  const newDef = FLAT[idx].def;
  const fromScreen = (cur >= 0 && cur < FLAT.length) ? FLAT[cur].screen.id : null;
  const toScreen = FLAT[idx].screen.id;

  const guitarScreens = ['s11','s12','s13','s14','s15'];
  if (guitarScreens.indexOf(fromScreen) >= 0 && guitarScreens.indexOf(toScreen) < 0){
    stopGuitar(1200);
  }

  if (type === 'slide'){
    const old = currentPageEl;
    if (old && old._sched) old._sched.clear();
    if (old && old._cleanup) old._cleanup();
    if (old){
      old.style.transition = 'transform .9s cubic-bezier(.6,0,.3,1)';
      old.style.transform = 'translateX(-100%)';
    }
    cur = idx;
    const el = buildAndPlace(idx, true);
    el.style.transition = 'none';
    el.style.transform = 'translateX(100%)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .9s cubic-bezier(.6,0,.3,1)';
        el.style.transform = 'translateX(0)';
      });
    });
    setTimeout(function(){
      if (!newDef.keepPrev && old && old.parentNode) old.remove();
      oldTransient.forEach(function(a){ try{ a.pause(); }catch(e){} });
      finishNav(idx);
    }, 950);
    return;
  }

  if (type === 'fade'){
    const old = currentPageEl;
    cur = idx;
    const el = buildAndPlace(idx, true);
    el.style.opacity = '0';
    el.style.transition = 'opacity .8s ease';
    requestAnimationFrame(function(){ el.style.opacity = '1'; });
    if (old && old._sched) old._sched.clear();
    if (old && old._cleanup) old._cleanup();
    setTimeout(function(){
      if (!newDef.keepPrev && old && old.parentNode) old.remove();
      oldTransient.forEach(function(a){ try{ a.pause(); }catch(e){} });
      finishNav(idx);
    }, 850);
    return;
  }

    const slowBlink = !!newDef.slowBlink || forceSlowBlink;
  forceSlowBlink = false;   /* 用完立即重置 */
  if (slowBlink){
    lidTop.classList.add('slow');
    lidBottom.classList.add('slow');
  } else {
    lidTop.classList.remove('slow');
    lidBottom.classList.remove('slow');
  }
  setIcon(btnLeft, true); setIcon(btnRight, true); setIcon(btnCenter, true);
  lidTop.classList.add('closed');
  lidBottom.classList.add('closed');
  setTimeout(function(){
    cur = idx;
    try {
      buildAndPlace(idx);
    } catch(err){
      console.error('[buildPage error]', err);
      busy = false;
      lidTop.classList.remove('closed');
      lidBottom.classList.remove('closed');
      lidTop.classList.remove('slow');
      lidBottom.classList.remove('slow');
      resetIcons();
      return;
    }
    setTimeout(function(){
      lidTop.classList.remove('closed');
      lidBottom.classList.remove('closed');
      resetIcons();
      oldTransient.forEach(function(a){ try{ a.pause(); }catch(e){} });
      setTimeout(function(){
        finishNav(idx);
        lidTop.classList.remove('slow');
        lidBottom.classList.remove('slow');
      }, slowBlink ? 900 : 480);
    }, slowBlink ? 200 : 90);
  }, slowBlink ? 1100 : 520);
}

function finishNav(idx){
  busy = false;
  updateProgress();
  refreshFloatChars();
  setProgressVisible(false);
  updateBgmForPage(idx);   /* ★ 处理 BGM 的 duck / fadeout */
  const def = FLAT[idx].def;
  showCenter(!!def.showCenter);
  if (def.showCenter){ showLR(false, false); }
  else { showLR(true, true); }
  if (def.leftAction === 'next'){ btnLeft.dataset.mode = 'next'; }
  else { btnLeft.dataset.mode = ''; }
  if (def.centerClosed){ setIcon(btnCenter, true); }
  else { setIcon(btnCenter, false); }

  /* ★ 末页（彩蛋）：右边按钮变闭眼、不可点 */
  if (idx === FLAT.length - 1){
    setIcon(btnRight, true);
    btnRight.style.pointerEvents = 'none';
    btnRight.style.opacity = '0.42';
  } else {
    btnRight.style.pointerEvents = '';
    btnRight.style.opacity = '';
  }

  /* ★ 封面第 2 页（“睁开双眼是天空”）：隐藏所有翻页按钮 */
  const isCoverP2 = (def === SCREENS[0].pages[1]);
  if (isCoverP2){
    showLR(false, false);
    showCenter(false);
  }
}

function goNext(){
  if (busy) return;
  const pageEl = currentPageEl;
  if (pageEl && typeof pageEl._beforeNext === 'function'){
    busy = true;
    pageEl._beforeNext(function(t){
      busy = false;
      doNavigate(cur + 1, t || 'auto');
    });
    return;
  }
  if (pageEl && pageEl._nextType){ doNavigate(cur + 1, pageEl._nextType); return; }
  doNavigate(cur + 1, 'auto');
}
function goPrev(){
  if (busy) return;
  const def = FLAT[cur].def;
  if (def.leftAction === 'next'){ goNext(); return; }
  if (cur <= 0) return;

  /* ★ 跳过 leftAction:'next' 的页（第四屏第2页），
        这样第五屏第1页点左键会直接回到第四屏第1页 */
  let target = cur - 1;
  while (target > 0 && FLAT[target].def.leftAction === 'next'){
    target--;
  }
  doNavigate(target, 'auto');
}

/* ================================================================
   进度条
   ================================================================ */
/* ★ 进度条不包含封面 / 序言卡 / 彩蛋 */
const PROGRESS_SKIP = ['cover','prologue','egg'];
const PROGRESS_PAGES = [];
FLAT.forEach(function(item, i){
  if (PROGRESS_SKIP.indexOf(item.screen.id) < 0) PROGRESS_PAGES.push(i);
});
function progressIndexOf(flatIdx){
  return PROGRESS_PAGES.indexOf(flatIdx);
}

const progressBar   = document.getElementById('progressBar');
const progressRange = document.getElementById('progressRange');
const progressLabel = document.getElementById('progressLabel');
let draggingProgress = false;
let progressDraggingNow = false;
let progressVisibleNow  = false;

function setProgressVisible(v){
  /* ★ 封面、序言、彩蛋页不显示进度条 */
  if (cur >= 0 && cur < FLAT.length &&
      ['cover','prologue','egg'].indexOf(FLAT[cur].screen.id) >= 0){
    v = false;
  }
  if (v === progressVisibleNow) return;
  progressVisibleNow = v;
  progressBar.classList.toggle('visible', v);
}
document.addEventListener('mousemove', function(e){
  if (progressDraggingNow) return;
  const threshold = window.innerHeight - 90;
  setProgressVisible(e.clientY > threshold);
});
document.addEventListener('mouseleave', function(){
  if (!progressDraggingNow) setProgressVisible(false);
});
progressRange.addEventListener('pointerdown', function(){
  progressDraggingNow = true;
  setProgressVisible(true);
});
progressRange.addEventListener('pointerup', function(){
  progressDraggingNow = false;
});
progressRange.addEventListener('pointercancel', function(){
  progressDraggingNow = false;
});

function updateProgress(){
  if (draggingProgress) return;
  const total = PROGRESS_PAGES.length;
  const pi = progressIndexOf(cur);
  if (pi < 0){
    /* 当前页不在进度条范围内（封面 / 序言 / 彩蛋） */
    progressRange.value = '0';
    progressLabel.textContent = '-';
    return;
  }
  const p = (total > 1) ? (pi / (total - 1)) : 0;
  progressRange.value = String(p * 100);
  progressLabel.textContent = (pi + 1) + ' / ' + total;
}
progressRange.addEventListener('pointerdown', function(){
  draggingProgress = true;
});
progressRange.addEventListener('input', function(){
  const p = parseFloat(this.value) / 100;
  const total = PROGRESS_PAGES.length;
  const pi = Math.round(p * (total - 1));
  progressLabel.textContent = (pi + 1) + ' / ' + total;
});
progressRange.addEventListener('change', function(){
  draggingProgress = false;
  const p = parseFloat(this.value) / 100;
  const total = PROGRESS_PAGES.length;
  const pi = Math.round(p * (total - 1));
  const t = PROGRESS_PAGES[pi];
  if (t != null && t !== cur && t >= 0 && t < FLAT.length){
    jumpTo(t);       /* ★ 从屏首顺序构建，防止依赖页缺失 */
  } else {
    updateProgress();
  }
});

/* ================================================================
   文字悬浮抖动：mousemove 检测
   ================================================================ */
let _floatChars = [];
let _lastRefresh = 0;
let _mouseX = -1, _mouseY = -1;
let _scanning = false;

function refreshFloatChars(){
  _floatChars = Array.prototype.slice.call(document.querySelectorAll('.txt .float-char'));
}

function scanFloat(){
  if (_scanning) return;
  _scanning = true;
  const x = _mouseX, y = _mouseY;
  for (let i = 0; i < _floatChars.length; i++){
    const c = _floatChars[i];
    if (!c.isConnected) continue;
    const r = c.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){
      const now = performance.now();
      const last = parseFloat(c.dataset.lf || '0');
      if (now - last < 600){ _scanning = false; return; }
      c.dataset.lf = String(now);
      c.classList.remove('float-hovered');
      void c.offsetWidth;
      c.classList.add('float-hovered');
      _scanning = false;
      return;
    }
  }
  _scanning = false;
}

document.addEventListener('mousemove', function(e){
  /* 鼠标没动就不扫（避免重复触发） */
  const dx = Math.abs(e.clientX - _mouseX);
  const dy = Math.abs(e.clientY - _mouseY);
  if (dx < 3 && dy < 3) return;
  _mouseX = e.clientX;
  _mouseY = e.clientY;
  /* 每 60ms 扫一次，节流 */
  const now = performance.now();
  if (now - _lastRefresh < 60) return;
  _lastRefresh = now;
  /* 惰性刷新缓存（每 500ms 检查一次页面是否变了） */
  if (!_floatChars.length || (now - refreshFloatChars._t || 0) > 500){
    refreshFloatChars();
    refreshFloatChars._t = now;
  }
  scanFloat();
});

/* ★ 浏览器限制自动播放：第一次点击或按键时"预热"简单.mp3（音量为 0），
   等到序言卡时再把它淡入到正常音量 */
(function bindBgmUnlock(){
  function unlock(){
    if (bgmUnlocked) return;
    bgmUnlocked = true;
    playBgm('简单.mp3', 0, 0);
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
  }
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
})();

/* ★ 全局错误兜底：任何未捕获的错误都打印到控制台，方便排查 */
window.addEventListener('error', function(e){
  console.error('[全局错误]', e.message, e.filename, e.lineno, e.colno);
});

/* ★ 启动：如果 init 抛错，不要黑屏，显示兜底提示 */
try {
  init();
} catch(err){
  console.error('[init 失败]', err);
  var fb = document.createElement('div');
  fb.style.cssText =
    'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
    'background:#04060d;color:#c8d8ff;font-family:sans-serif;font-size:24px;' +
    'text-align:center;line-height:1.8;padding:40px;z-index:99999;';
  fb.innerHTML = '页面加载遇到问题，请刷新重试。<br>如果反复失败，请按 F12 查看控制台错误信息。';
  document.body.appendChild(fb);
}

})();
</script>
</body>
</html>
