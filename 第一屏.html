<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;

#scenes{position:absolute;inset:0;}
.page{position:absolute;inset:0;overflow:hidden;}
.asset{position:absolute;user-select:none;-webkit-user-drag:none;display:block;pointer-events:none;}

.txt{position:absolute;color:#fff;font-size:58px;line-height:1.9;letter-spacing:.05em;
  text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.55);
  pointer-events:none;user-select:none;word-break:break-word;}
.txt p{margin:0;text-indent:2em;}
.txt p.no-indent{text-indent:0;}

#ui{position:absolute;inset:0;z-index:8000;pointer-events:none;}
.navbtn{position:absolute;width:360px;height:360px;padding:0;border:none;

.navbtn:hover{opacity:1;}
.navbtn:active{transform:scale(.94);}
#btnLeft{left:70px;bottom:20px;}
#btnRight{right:70px;bottom:20px;}
#btnCenter{left:50%;top:50%;transform:translate(-50%,-50%);width:720px;height:720px;display:none;}
#btnCenter:hover{transform:translate(-50%,-50%) scale(1.04);}

.navbtn.hidden{display:none!important;}

.eyelid{position:absolute;left:0;width:100%;height:51%;z-index:9000;
  pointer-events:none;background-color:#04060d;background-repeat:no-repeat;
  background-size:100% auto;transition:transform .5s cubic-bezier(.62,0,.38,1);will-change:transform;}
#lidTop{top:0;transform:translateY(-101%);background-image:url("上眼皮.png");background-position:top center;}
#lidBottom{bottom:0;transform:translateY(101%);background-image:url("下眼皮.png");background-position:bottom center;}

#eggScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;pointer-events:auto;}
#eggScroll::-webkit-scrollbar{width:10px;}

.eggInner{position:relative;width:2560px;margin:0 auto;}
.eggBg{width:2560px;display:block;}
.eggImg{position:absolute;cursor:zoom-in;transition:transform .25s;}
.eggImg:hover{transform:scale(1.03);}
#lightbox{position:absolute;inset:0;z-index:9500;background:rgba(0,0,0,.92);

#lightbox.on{display:flex;}
#lightbox img{max-width:88%;max-height:88%;object-fit:contain;border-radius:14px;}

#debugBtn{position:fixed;right:16px;bottom:16px;z-index:99999;width:48px;height:48px;
  border-radius:50%;border:none;background:rgba(90,90,160,.65);color:#fff;font-size:15px;
  font-family:sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;
  user-select:none;transition:background .2s;letter-spacing:1px;}
#debugBtn:hover{background:rgba(120,120,200,.9);}
#debugBtn.on{background:rgba(255,180,0,.95);color:#222;font-weight:bold;}

#debugPanel{position:fixed;right:16px;top:16px;z-index:99998;width:300px;
  max-height:calc(100vh - 100px);overflow-y:auto;background:rgba(20,20,35,.94);color:#e8e8f0;
  border:1px solid rgba(255,180,0,.5);border-radius:10px;padding:14px 16px;
  font-family:Consolas,Monaco,monospace;font-size:13px;line-height:1.6;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.6);}
#debugPanel.on{display:block;}
#debugPanel::-webkit-scrollbar{width:6px;}
#debugPanel::-webkit-scrollbar-thumb{background:rgba(255,180,0,.3);border-radius:3px;}
#debugPanel .title{font-weight:bold;color:#ffb400;font-size:14px;margin-bottom:10px;letter-spacing:1px;}
#debugPanel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;}
#debugPanel .row .k{color:#8fa0c0;flex:none;min-width:56px;font-size:12px;}
#debugPanel .row .v{color:#c8d8ff;text-align:right;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
#debugPanel input[type=number],#debugPanel input[type=color],#debugPanel select,#debugPanel textarea{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,180,0,.35);border-radius:5px;
  color:#ffd880;font-family:inherit;font-size:12px;padding:3px 6px;outline:none;}
#debugPanel input[type=number]{width:70px;}
#debugPanel input[type=color]{width:44px;height:24px;padding:0;cursor:pointer;}
#debugPanel select{width:110px;cursor:pointer;}
#debugPanel textarea{width:100%;resize:vertical;min-height:52px;margin-top:4px;line-height:1.5;}
#debugPanel .section-title{color:#ffb400;font-size:12px;margin-top:10px;margin-bottom:6px;

#debugPanel .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;}
#debugPanel .btns button{padding:7px 4px;border-radius:6px;border:1px solid rgba(255,180,0,.4);

  transition:background .15s;}
#debugPanel .btns button:hover{background:rgba(255,180,0,.3);}
#debugPanel .btns button.danger{border-color:rgba(255,90,90,.5);background:rgba(255,90,90,.12);color:#ff9090;}
#debugPanel .btns button.danger:hover{background:rgba(255,90,90,.3);}
#debugPanel .hint{margin-top:10px;font-size:11px;color:#8090a8;line-height:1.5;

.resize-handle{position:absolute;width:22px;height:22px;

#toast{position:fixed;left:50%;top:30px;transform:translateX(-50%);

#toast.on{opacity:1;}

.swipe-hint{position:absolute;right:180px;top:32%;transform:translateY(-50%);

@keyframes swipePulse{

.swipe-hint .arrow{font-size:64px;}

.music-close{

}
.music-close:hover{background:rgba(90,90,160,.85);}
.music-close:active{transform:scale(.9);}

.swipe-slider{
  -webkit-appearance:none;appearance:none;

.swipe-slider::-webkit-slider-thumb:active{transform:scale(1.12);cursor:grabbing;}
.swipe-slider::-moz-range-thumb{
  width:56px;height:56px;border-radius:50%;
  background:#e8eaff;border:4px solid #5a6ec9;

}
.swipe-slider::-moz-range-thumb:active{cursor:grabbing;}
.slider-label{

.swipe-slider::-moz-range-thumb{

/* ---- 个人朋友圈详情 ---- */
#profileSheet{

.pf-inner{

<script>
(function(){
'use strict';

const W = 2560, H = 1440;
const stage    = document.getElementById('stage');
const scenes   = document.getElementById('scenes');
const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnCenter= document.getElementById('btnCenter');
const lidTop   = document.getElementById('lidTop');
const lidBottom= document.getElementById('lidBottom');
const ICON_OPEN = "url('睁眼.png')";
const ICON_CLOSE= "url('闭眼.png')";

/* ---------- 工具 ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function placeholder(label){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800">'+
   '<rect width="100%" height="100%" fill="rgba(20,20,40,0.78)" '+
   'stroke="rgba(160,160,220,0.55)" stroke-width="5" stroke-dasharray="18 14"/>'+
   '<text x="50%" y="50%" fill="rgba(200,200,240,0.9)" font-family="sans-serif" '+
   'font-size="52" text-anchor="middle" dominant-baseline="middle">'+esc(label)+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function makeImg(src, style, label){
  const img = document.createElement('img');
  img.className = 'asset'; img.alt = ''; img.draggable = false;
  img.onerror = function(){
    if (this.dataset.fb) return;
    this.dataset.fb = '1';
    this.src = placeholder(label || (src||'').replace(/\.\w+$/,'') || '空白');
  };
  if (src) img.src = src;
  else { img.dataset.fb = '1'; img.src = placeholder(label || '空白'); }
  if (style) for (const k in style) img.style[k] = style[k];
  return img;
}
function makeSched(){
  const timers = [];
  return {
    after(ms, fn){ const t = setTimeout(fn, ms); timers.push(t); return t; },
    clear(){ timers.forEach(clearTimeout); timers.length = 0; }
  };
}
function textToHtml(text, noIndent){
  const lines = String(text).split('\n');
  return lines.map(function(line){
    const cls = noIndent ? ' class="no-indent"' : '';
    return '<p' + cls + '>' + esc(line) + '</p>';
  }).join('');
}
function htmlToText(html){
  let s = String(html);
  s = s.replace(/<br\s*\/?>/gi, '\n');
  const paras = [];
  s.replace(/<p[^>]*>([\s\S]*?)<\/p>/gi, function(_, inner){
    paras.push(inner); return '';
  });
  if (paras.length) s = paras.join('\n');
  s = s.replace(/<div class="resize-handle"><\/div>/g, '');
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&nbsp;/g,' ').trimEnd();
}

/* ---------- 音频 ---------- */
let transientAudios = [];
const persistentAudios = {};
function playSfx(file, opts){
  opts = opts || {};
  let a;
  try { a = new Audio(file); } catch(e){ return null; }
  a.loop = !!opts.loop;
  a.volume = (opts.volume != null) ? opts.volume : 0.85;
  a.play().catch(function(){});
  if (opts.persistent){
    if (persistentAudios[file]){ try{ persistentAudios[file].pause(); }catch(e){} }
    persistentAudios[file] = a;
  } else transientAudios.push(a);
  return a;
}
function stopPersistent(file){
  if (persistentAudios[file]){ try{ persistentAudios[file].pause(); }catch(e){} delete persistentAudios[file]; }
}
function startCicada(){
  if (persistentAudios['蝉鸣.mp3']) return;
  playSfx('蝉鸣.mp3', {loop:true, volume:0.55, persistent:true});
}
function stopCicada(){ stopPersistent('蝉鸣.mp3'); }
function stopAllTransient(){
  transientAudios.forEach(function(a){ try{ a.pause(); }catch(e){} });
  transientAudios = [];
}
/* 点击音效 */
function playClick(){
  playSfx('点击音效.mp3', {volume:0.6});
}

/* 蝉鸣渐强（5秒淡入到 0.55 音量） */
function startCicadaFadeIn(dur){
  if (persistentAudios['蝉鸣.mp3']) return;
  const a = playSfx('蝉鸣.mp3', {loop:true, volume:0, persistent:true});
  if (!a) return;
  const target = 0.55;
  const t0 = performance.now();
  const iv = setInterval(function(){
    const p = Math.min(1, (performance.now() - t0) / dur);
    try { a.volume = target * p; } catch(e){}
    if (p >= 1) clearInterval(iv);
  }, 50);
}

/* 屏幕晃动（约 0.5s） */
function shakeScreen(){
  const scale = getStageScale();
  const keys = [[0,0],[80,-14],[160,12],[240,-10],[320,8],[400,-5],[480,0]];
  const t0 = performance.now();
  function step(){
    const e = performance.now() - t0;
    if (e > 500){
      stage.style.transform = 'scale(' + scale + ')';
      return;
    }
    let x = 0;
    for (let i = 0; i < keys.length - 1; i++){
      if (e >= keys[i][0] && e <= keys[i+1][0]){
        const p = (e - keys[i][0]) / (keys[i+1][0] - keys[i][0]);
        x = keys[i][1] + (keys[i+1][1] - keys[i][1]) * p;
        break;
      }
    }
    stage.style.transform = 'scale(' + scale + ') translateX(' + x + 'px)';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- 吉他（带淡出 + 右上角关闭按钮） ---------- */
let guitarPlaying = false;
let guitarBtn = null;
let guitarFadeTimer = null;
function startGuitar(){
  if (guitarPlaying) return;
  if (guitarFadeTimer){ clearInterval(guitarFadeTimer); guitarFadeTimer = null; }
  playSfx('吉他.mp3', {loop:true, volume:0.5, persistent:true});
  guitarPlaying = true;
  showGuitarBtn();
}
function stopGuitar(fadeMs){
  if (!guitarPlaying && !persistentAudios['吉他.mp3']) return;
  fadeMs = (fadeMs == null) ? 1200 : fadeMs;
  const a = persistentAudios['吉他.mp3'];
  guitarPlaying = false;
  hideGuitarBtn();
  if (!a){ return; }
  if (fadeMs <= 0){
    try { a.pause(); } catch(e){}
    delete persistentAudios['吉他.mp3'];
    return;
  }
  const startVol = a.volume;
  const start = performance.now();
  if (guitarFadeTimer) clearInterval(guitarFadeTimer);
  guitarFadeTimer = setInterval(function(){
    const t = (performance.now() - start) / fadeMs;
    if (t >= 1){
      clearInterval(guitarFadeTimer);
      guitarFadeTimer = null;
      try { a.pause(); } catch(e){}
      delete persistentAudios['吉他.mp3'];
      return;
    }
    try { a.volume = Math.max(0, startVol * (1 - t)); } catch(e){}
  }, 40);
}
function showGuitarBtn(){
  if (guitarBtn) return;
  guitarBtn = document.createElement('button');
  guitarBtn.className = 'music-close';
  guitarBtn.type = 'button';
  guitarBtn.title = '关闭音乐';
  guitarBtn.textContent = '×';
  guitarBtn.addEventListener('click', function(e){
    e.stopPropagation();
    stopGuitar(800);
  });
  stage.appendChild(guitarBtn);
}
function hideGuitarBtn(){
  if (guitarBtn){ guitarBtn.remove(); guitarBtn = null; }
}

function applySaved(el, eid){

  if (d.lineHeight != null && el.classList.contains('txt')){
    const fs = d.fontSize || parseFloat(el.style.fontSize) || 58;
    el.style.lineHeight = fs ? (d.lineHeight / fs) : d.lineHeight;
  }
  if (d.textAlign != null && el.classList.contains('txt')) el.style.textAlign = d.textAlign;
  if (d.noIndent != null && el.classList.contains('txt')){
    el.dataset.noIndent = d.noIndent ? '1' : '';

  if (d.opacity != null && !el.classList.contains('txt')) el.style.opacity = d.opacity;

    const clean = String(d.textContent).replace(/<div class="resize-handle"><\/div>/g, '');
    el.innerHTML = textToHtml(clean, d.noIndent ? true : false);
  }
  return true;
}
function normalizeElement(el, pageEl){
  if (el.dataset.noDebug) return;
  if (el.dataset.normalized) return;
  if (!el.offsetParent) return;
  const scale = getStageScale();
  const pageRect = pageEl.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const x = (r.left - pageRect.left) / scale;
  const y = (r.top  - pageRect.top ) / scale;
  const w = r.width / scale;
  const h = r.height / scale;
  el.style.left = Math.round(x) + 'px';
  el.style.top  = Math.round(y) + 'px';
  if (el.classList.contains('txt')){
    el.style.width = Math.round(w) + 'px';
  } else {
    el.style.width  = Math.round(w) + 'px';
    el.style.height = Math.round(h) + 'px';
  }
  el.style.transform = 'none';
  el.dataset.normalized = '1';
}
function attachDraggable(el){
  if (!DEBUG.enabled) return;
  if (el.dataset.noDebug) return;
  if (el.dataset.dragBound) return;
  el.dataset.dragBound = '1';
  el.style.cursor = 'move';
  if (!el.style.outline || el.style.outline.indexOf('dashed') >= 0){
    el.style.outline = '1px dashed rgba(255,180,0,.4)';
  }
  el.addEventListener('mousedown', onDragStart);
}
function onDragStart(e){
  if (!DEBUG.enabled) return;
  if (e.button !== 0) return;
  if (e.target.classList && e.target.classList.contains('resize-handle')) return;
  e.stopPropagation(); e.preventDefault();
  const el = e.currentTarget;
  normalizeElement(el, currentPageEl);
  selectElement(el);
  const scale = getStageScale();
  const sx = e.clientX, sy = e.clientY;
  const sl = parseFloat(el.style.left) || 0;
  const st = parseFloat(el.style.top)  || 0;
  function move(ev){
    const dx = (ev.clientX - sx) / scale;
    const dy = (ev.clientY - sy) / scale;
    el.style.left = Math.round(sl + dx) + 'px';
    el.style.top  = Math.round(st + dy) + 'px';
    updatePanelInfo();
  }
  function up(){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    saveElement(el);
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function makeResizeHandler(el){
  return function(e){
    if (!DEBUG.enabled) return;
    e.stopPropagation(); e.preventDefault();
    const scale = getStageScale();
    const sx = e.clientX, sy = e.clientY;
    const sw = parseFloat(el.style.width)  || el.offsetWidth;
    const sh = parseFloat(el.style.height) || el.offsetHeight;
    const isText = el.classList.contains('txt');
    const sfs = parseFloat(el.style.fontSize) || 0;
    function move(ev){
      const dx = (ev.clientX - sx) / scale;
      const dy = (ev.clientY - sy) / scale;
      if (isText){
        const nw = Math.max(80, sw + dx);
        el.style.width = Math.round(nw) + 'px';
        if (ev.shiftKey && sfs > 0){
          const ratio = nw / sw;
          el.style.fontSize = Math.round(sfs * ratio) + 'px';
        }
      } else {
        const nw = Math.max(20, sw + dx);
        const nh = ev.shiftKey ? Math.max(20, Math.round(nw * sh / sw)) : Math.max(20, sh + dy);
        el.style.width  = Math.round(nw) + 'px';
        el.style.height = Math.round(nh) + 'px';
      }
      updatePanelInfo();
      updateHandlePosition();
    }
    function up(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      saveElement(el);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
}
function positionHandle(h, el, pageEl){
  if (!h || !el || !pageEl) return;
  const scale = getStageScale();
  const pageRect = pageEl.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const x = (r.right  - pageRect.left) / scale;
  const y = (r.bottom - pageRect.top ) / scale;
  h.style.left = (x - 11) + 'px';
  h.style.top  = (y - 11) + 'px';
}
function updateHandlePosition(){
  if (!DEBUG.selected || !DEBUG.selected._handle) return;
  positionHandle(DEBUG.selected._handle, DEBUG.selected, currentPageEl);
}
function selectElement(el){
  if (DEBUG.selected === el){ updatePanelInfo(); return; }
  if (DEBUG.selected) deselectElement(DEBUG.selected);
  DEBUG.selected = el;
  el.style.outline = '2px solid rgba(255,180,0,.95)';
  el.style.boxShadow = '0 0 0 1px rgba(255,180,0,.4), 0 0 24px rgba(255,180,0,.35)';
  const pageEl = currentPageEl || scenes;
  const h = document.createElement('div');
  h.className = 'resize-handle';
  h.addEventListener('mousedown', makeResizeHandler(el));
  pageEl.appendChild(h);
  el._handle = h;
  positionHandle(h, el, pageEl);
  updatePanelInfo();
}
function deselectElement(el){

function saveElement(el){
  const eid = el.dataset.eid;

  const data = {
    left: Math.round(parseFloat(el.style.left) || 0),

  };
  if (el.classList.contains('txt')){
    const fs = parseFloat(el.style.fontSize) || parseFloat(getComputedStyle(el).fontSize);
    if (fs) data.fontSize = Math.round(fs);
    const lh = parseFloat(el.style.lineHeight) || parseFloat(getComputedStyle(el).lineHeight);
    if (lh) data.lineHeight = Math.round(lh * 100) / 100;
    const c = el.style.color || getComputedStyle(el).color;
    if (c) data.color = c;
    const ta = el.style.textAlign || getComputedStyle(el).textAlign;
    if (ta) data.textAlign = ta;
    data.noIndent = el.dataset.noIndent === '1';
    data.textContent = htmlToText(cleanOuterHTML(el));
    delete data.height;
  } else {
    if (el.style.objectFit) data.objectFit = el.style.objectFit;
    data.opacity = Math.round((parseFloat(el.style.opacity) || 1) * 100) / 100;
  }
  DEBUG.data[eid] = data;

}
function toHex(c){
  if (!c) return '#ffffff';
  if (c.charAt(0) === '#'){
    if (c.length === 4) return '#' + c[1]+c[1] + c[2]+c[2] + c[3]+c[3];
    return c.slice(0,7);
  }
  const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#ffffff';
  const h = n => ('0' + parseInt(n,10).toString(16)).slice(-2);
  return '#' + h(m[1]) + h(m[2]) + h(m[3]);
}

/* ================================================================
   页面构建
   ================================================================ */
function buildPage(idx){
  const def = FLAT[idx].def;
  const root = document.createElement('div');
  root.className = 'page';
  const sched = makeSched();
  root._sched = sched;
  let eidCounter = 0;
  const newEid = function(){ return 'p' + idx + '_e' + (eidCounter++); };

  /* 背景 */
  if (def.bg){
    if (def.bg.charAt(0) === '#'){
      root.style.background = def.bg;
    } else {
      const bgImg = makeImg(def.bg + '.png',
        {left:'0',top:'0',width:'100%',height:'100%',objectFit:'cover'}, def.bg);
      bgImg.dataset.noDebug = '1';
      root.appendChild(bgImg);
    }
  }

  /* 上下文 */
  const ctx = {
    root: root, sched: sched, index: idx, newEid: newEid,
    after: function(ms, fn){ return sched.after(ms, fn); },

    registerAsset: function(el, label){
      const eid = newEid();
      el.dataset.eid = eid;
      if (label) el.dataset.label = label;
      applySaved(el, eid);
      if (DEBUG.enabled) attachDraggable(el);
      return el;
    },

    addImg: function(src, style, label){
      const img = makeImg(src, style, label);
      ctx.registerAsset(img, label);
      root.appendChild(img);
      return img;
    },

    /* 单段文字 */
    addText: function(html, opt, delay){
      opt = opt || {};
      const eid = newEid();
      const d = document.createElement('div');
      d.className = 'txt';
      d.dataset.eid = eid;
      const noIndent = !!opt.noIndent;
      if (noIndent) d.dataset.noIndent = '1';
      d.innerHTML = textToHtml(html, noIndent);

      const x      = (opt.x != null) ? opt.x : 1280;
      const y      = (opt.y != null) ? opt.y : 720;
      const anchor = opt.anchor || 'center';
      const width  = (opt.width != null) ? opt.width : 1800;
      const fs     = (opt.fontSize != null) ? opt.fontSize : 58;
      d.style.left = x + 'px';
      d.style.top  = y + 'px';
      d.style.width = width + 'px';
      d.style.fontSize = fs + 'px';
      let tx, align;
      if (anchor === 'left'){ tx = '0'; align = 'left'; }
      else if (anchor === 'right'){ tx = '-100%'; align = 'right'; }
      else { tx = '-50%'; align = 'center'; }
      d.style.transform = 'translate(' + tx + ', -50%)';
      d.style.textAlign = opt.align || align;
      if (opt.color) d.style.color = opt.color;
      if (opt.textShadow != null) d.style.textShadow = opt.textShadow;
      if (opt.lineHeight) d.style.lineHeight = opt.lineHeight;
      if (opt.letterSpacing) d.style.letterSpacing = opt.letterSpacing;
      root.appendChild(d);

            if (!applySaved(d, eid)){
        const inMs  = opt.fade ? (opt.fade.inMs  || 350) : 1100;
        const hold  = opt.fade ? (opt.fade.holdMs|| 0)   : 0;
        const outMs = opt.fade ? (opt.fade.outMs || 350) : 0;
        const startDelay = (delay == null ? 150 : delay);
        if (opt.flip){
          d.style.opacity = '0';
          d.style.transform = 'translate(' + tx + ', -50%) perspective(900px) rotateX(-90deg)';
          d.style.transformOrigin = 'center center';
          d.style.transition = 'opacity .5s ease, transform .7s cubic-bezier(.3,1.1,.4,1)';
          sched.after(startDelay, function(){
            d.style.opacity = '1';
            d.style.transform = 'translate(' + tx + ', -50%) perspective(900px) rotateX(0deg)';
          });
        } else {
          d.style.opacity = '0';
          d.style.transition = 'opacity ' + (inMs/1000) + 's ease';
          sched.after(startDelay, function(){
            d.style.opacity = '1';
            if (opt.fade){
              sched.after(inMs + hold, function(){
                d.style.transition = 'opacity ' + (outMs/1000) + 's ease';
                d.style.opacity = '0';
                sched.after(outMs + 50, function(){
                  if (d.parentNode) d.remove();
                });
              });
            }
          });
        }
      }
      if (DEBUG.enabled) attachDraggable(d);
      return d;
    },

    /* ★ 新增：多行文字按行间隔依次出现，自动居中分布 */
    addLines: function(lines, opt, startDelay, stepMs){
      opt = opt || {};
      startDelay = (startDelay == null) ? 300 : startDelay;
      stepMs    = (stepMs == null) ? 400 : stepMs;
      const baseY = (opt.y != null) ? opt.y : 720;
      const lineGap = opt.lineGap || 130;
      const totalH = (lines.length - 1) * lineGap;
      const startY = baseY - totalH / 2;
      lines.forEach(function(line, i){
        ctx.after(startDelay + i * stepMs, function(){
          const o = Object.assign({}, opt, {y: startY + i * lineGap});
          ctx.addText(line, o, 0);
        });
      });
    }
  };

  if (def.build) def.build(ctx);
  if (typeof ctx.beforeNext === 'function') root._beforeNext = ctx.beforeNext;
  if (def.nextType) root._nextType = def.nextType;
  return root;
}

        content:'山脚公园还是老样子。' },
      { type:'photo',  src:'我3.png', x: 330, y: 1140, w: 820, h: 500 },
      { type:'like',   x: 330, y: 1670, count: 8 },

      /* ---- 第 3 条 ---- */
      { type:'avatar', src:'A.png', name:'小A', x: 180, y: 1850, w: 110, h: 110 },
      { type:'text',   x: 330, y: 1870, w: 1600, fs: 36, color:'#222',
        content:'今天头不痛了。' },
      { type:'photo',  src:'A.png', x: 330, y: 1990, w: 500, h: 500 },
      { type:'like',   x: 330, y: 2520, count: 6 },

      /* ---- 第 4 条 ---- */
      { type:'avatar', src:'B.png', name:'小B', x: 180, y: 2700, w: 110, h: 110 },
      { type:'text',   x: 330, y: 2720, w: 1600, fs: 36, color:'#222',
        content:'复习去了，别找我。' },
      { type:'like',   x: 330, y: 2810, count: 4 },

      /* ---- 第 5 条 ---- */
      { type:'avatar', src:'E.png', name:'小E', x: 180, y: 3050, w: 110, h: 110 },
      { type:'text',   x: 330, y: 3070, w: 1600, fs: 36, color:'#222',
        content:'被他们从电脑前拽出来了。' },
      { type:'photo',  src:'E.png', x: 330, y: 3190, w: 600, h: 600 },
      { type:'like',   x: 330, y: 3820, count: 9 }
    ];
    /* ============================================ */

    /* ---- 滚动容器 ---- */
    const scroll = document.createElement('div');
    scroll.id = 'eggScroll';
    scroll.dataset.noDebug = '1';

    const inner = document.createElement('div');
    inner.className = 'eggInner';
    scroll.appendChild(inner);

    /* ---- 背景长图（load 后按真实比例撑高，高度自动） ---- */
    const bg = document.createElement('img');
    bg.className = 'eggBg';
    bg.alt = '';
    bg.onload = function(){
      const h = bg.naturalHeight * (2560 / bg.naturalWidth);
      inner.style.height = Math.max(h, 4000) + 'px';
    };
    bg.onerror = function(){
      if (this.dataset.fb) return;
      this.dataset.fb = '1';
      this.src = placeholder('朋友圈背景');
      inner.style.height = '4000px';
    };
    bg.src = '朋友圈.png';
    inner.appendChild(bg);

    /* ---- 渲染每个元素 ---- */
    ITEMS.forEach(function(item){
      if (item.type === 'avatar'){
        const av = document.createElement('img');
        av.className = 'egg-avatar';
        av.style.cssText =
          'left:' + item.x + 'px;top:' + item.y + 'px;' +
          'width:' + item.w + 'px;height:' + item.h + 'px;';
        av.onerror = function(){
          if (this.dataset.fb) return;
          this.dataset.fb = '1';
          this.src = placeholder(item.name || '头像');
        };
        av.src = item.src;
        av.onclick = function(){ showProfile(item.name); };
        inner.appendChild(av);
      }
      else if (item.type === 'text'){
        const tx = document.createElement('div');
        tx.className = 'egg-text';
        tx.style.cssText =
          'left:' + item.x + 'px;top:' + item.y + 'px;' +
          'width:' + item.w + 'px;font-size:' + (item.fs || 36) + 'px;' +
          'color:' + (item.color || '#222') + ';';
        tx.textContent = item.content || '';
        inner.appendChild(tx);
      }
      else if (item.type === 'photo'){
        const im = document.createElement('img');
        im.className = 'egg-photo';
        im.style.cssText =
          'left:' + item.x + 'px;top:' + item.y + 'px;' +
          'width:' + item.w + 'px;height:' + item.h + 'px;';
        im.onerror = function(){
          if (this.dataset.fb) return;
          this.dataset.fb = '1';
          this.src = placeholder('图片');
        };
        im.src = item.src;
        im.onclick = function(){ showLightbox(item.src); };
        inner.appendChild(im);
      }
      else if (item.type === 'like'){
        const btn = document.createElement('button');
        btn.className = 'egg-like';
        btn.style.cssText = 'left:' + item.x + 'px;top:' + item.y + 'px;';
        let liked = false, n = item.count || 0;
        btn.textContent = '♡ ' + n;
        btn.onclick = function(){
          liked = !liked;
          n += liked ? 1 : -1;
          btn.classList.toggle('liked', liked);
          btn.textContent = '♡ ' + n;
        };
        inner.appendChild(btn);
      }
    });

    ctx.root.appendChild(scroll);

    /* ---- 大图查看 ---- */
    let lb = document.getElementById('lightbox');
    if (!lb){
      lb = document.createElement('div');
      lb.id = 'lightbox';
      const li = document.createElement('img');
      lb.appendChild(li);
      lb.onclick = function(){ lb.classList.remove('on'); };
      document.body.appendChild(lb);
    }
    function showLightbox(src){
      lb.querySelector('img').src = src;
      lb.classList.add('on');
    }

    /* ---- 个人朋友圈详情 ---- */
    let pf = document.getElementById('profileSheet');
    if (!pf){
      pf = document.createElement('div');
      pf.id = 'profileSheet';
      pf.innerHTML =
        '<div class="pf-inner">' +
          '<div class="pf-close">×</div>' +
          '<div class="pf-head"></div>' +
          '<div class="pf-body"></div>' +
        '</div>';
      pf.querySelector('.pf-close').onclick = function(){ pf.classList.remove('on'); };
      pf.onclick = function(e){ if (e.target === pf) pf.classList.remove('on'); };
      document.body.appendChild(pf);
    }
    function showProfile(name){
      /* 从 ITEMS 中按 avatar.name 归档出该用户的所有动态 */
      const mine = [];
      let cur = null;
      ITEMS.forEach(function(it){
        if (it.type === 'avatar'){
          if (cur) mine.push(cur);
          cur = (it.name === name) ? { avatar: it.src, texts: [], photos: [] } : null;
        } else if (cur){
          if (it.type === 'text')  cur.texts.push(it.content || '');
          else if (it.type === 'photo') cur.photos.push(it.src);
        }
      });
      if (cur) mine.push(cur);

      const head = pf.querySelector('.pf-head');
      const body = pf.querySelector('.pf-body');
      const first = mine[0] || {};
      head.innerHTML =
        '<img src="' + (first.avatar || '') + '" ' +
        'onerror="this.src=\'' + placeholder(name) + '\'">' +
        '<div><div class="pf-name">' + esc(name) + '</div>' +
        '<div class="pf-count">' + mine.length + ' 条动态</div></div>';
      body.innerHTML = '';
      mine.forEach(function(x){
        const b = document.createElement('div');
        b.className = 'pf-item';
        const t = document.createElement('div');
        t.className = 'pf-item-text';
        t.textContent = x.texts.join('\n') || '（图片）';
        b.appendChild(t);
        if (x.photos.length){
          const g = document.createElement('div');
          g.className = 'pf-photos';
          x.photos.forEach(function(s){
            const im = document.createElement('img');
            im.src = s;
            im.onerror = function(){
              if (this.dataset.fb) return;
              this.dataset.fb = '1';
              this.src = placeholder('图片');
            };
            g.appendChild(im);
          });
          b.appendChild(g);
        }
        body.appendChild(b);
      });
      pf.classList.add('on');
    }
  }}
]});


const FLAT = [];
SCREENS.forEach(function(screen){
  screen.pages.forEach(function(page){
    FLAT.push({ def: page, screen: screen });
  });
});

/* ================================================================
   运行时
   ================================================================ */
let cur = 0;
let busy = false;
let currentPageEl = null;

function resize(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = 'scale(' + s + ')';
  if (DEBUG.selected) updateHandlePosition();
}
window.addEventListener('resize', resize);

function setIcon(btn, closed){ btn.style.backgroundImage = closed ? ICON_CLOSE : ICON_OPEN; }
function resetIcons(){
  setIcon(btnLeft, false); setIcon(btnRight, false); setIcon(btnCenter, false);
}
function showCenter(show){
  btnCenter.classList.toggle('hidden', !show);
  btnCenter.style.display = show ? 'block' : 'none';
}
function showLR(leftOn, rightOn){
  btnLeft.classList.toggle('hidden', !leftOn);
  btnRight.classList.toggle('hidden', !rightOn);
}

function buildAndPlace(idx, keepOld){
  const def = FLAT[idx].def;
  /* 先构建新页，若抛错旧页不受影响 */
  const el = buildPage(idx);
  if (!def.keepPrev && !keepOld){
    const oldPages = scenes.querySelectorAll('.page');
    oldPages.forEach(function(p){
      if (p._sched) p._sched.clear();
      if (p._cleanup) p._cleanup();
      p.remove();
    });
  }
  scenes.appendChild(el);
  currentPageEl = el;
  return el;
}

function doNavigate(idx, type){
  if (busy) return;
  if (idx < 0 || idx >= FLAT.length) return;
  busy = true;

  if (!type || type === 'auto'){
    const fromScreen = (cur >= 0 && cur < FLAT.length) ? FLAT[cur].screen.id : null;
    const toScreen = FLAT[idx].screen.id;
    type = (fromScreen === toScreen) ? 'fade' : 'eye';
  }

  const oldTransient = transientAudios;
  transientAudios = [];
  const newDef = FLAT[idx].def;
  const fromScreen = (cur >= 0 && cur < FLAT.length) ? FLAT[cur].screen.id : null;
  const toScreen = FLAT[idx].screen.id;

  const guitarScreens = ['s11','s12','s13','s14','s15'];
  if (guitarScreens.indexOf(fromScreen) >= 0 && guitarScreens.indexOf(toScreen) < 0){
    stopGuitar(1200);
  }

  if (type === 'slide'){
    const old = currentPageEl;
    if (old && old._sched) old._sched.clear();
    if (old && old._cleanup) old._cleanup();
    if (old){
      old.style.transition = 'transform .9s cubic-bezier(.6,0,.3,1)';
      old.style.transform = 'translateX(-100%)';
    }
    cur = idx;
    const el = buildAndPlace(idx, true);
    el.style.transition = 'none';
    el.style.transform = 'translateX(100%)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .9s cubic-bezier(.6,0,.3,1)';
        el.style.transform = 'translateX(0)';
      });
    });
    setTimeout(function(){
      if (!newDef.keepPrev && old && old.parentNode) old.remove();
      oldTransient.forEach(function(a){ try{ a.pause(); }catch(e){} });
      finishNav(idx);
    }, 950);
    return;
  }

  if (type === 'fade'){
    const old = currentPageEl;
    cur = idx;
    const el = buildAndPlace(idx, true);
    el.style.opacity = '0';
    el.style.transition = 'opacity .8s ease';
    requestAnimationFrame(function(){ el.style.opacity = '1'; });
    if (old && old._sched) old._sched.clear();
    if (old && old._cleanup) old._cleanup();
    setTimeout(function(){
      if (!newDef.keepPrev && old && old.parentNode) old.remove();
      oldTransient.forEach(function(a){ try{ a.pause(); }catch(e){} });
      finishNav(idx);
    }, 850);
    return;
  }

   /* eye */
  setIcon(btnLeft, true); setIcon(btnRight, true); setIcon(btnCenter, true);
  lidTop.classList.add('closed');
  lidBottom.classList.add('closed');
  setTimeout(function(){
    cur = idx;
    try {
      buildAndPlace(idx);
    } catch(err){
      console.error('[buildPage error]', err);
      busy = false;
      lidTop.classList.remove('closed');
      lidBottom.classList.remove('closed');
      resetIcons();
      return;
    }
    setTimeout(function(){
      lidTop.classList.remove('closed');
      lidBottom.classList.remove('closed');
      resetIcons();
      oldTransient.forEach(function(a){ try{ a.pause(); }catch(e){} });
      setTimeout(function(){ finishNav(idx); }, 480);
    }, 90);
  }, 520);
}

function finishNav(idx){
  busy = false;
  const def = FLAT[idx].def;
  showCenter(!!def.showCenter);
  if (def.showCenter){ showLR(false, false); }
  else { showLR(true, true); }
  if (def.leftAction === 'next'){ btnLeft.dataset.mode = 'next'; }
  else { btnLeft.dataset.mode = ''; }
  if (def.centerClosed){ setIcon(btnCenter, true); }
  else { setIcon(btnCenter, false); }

  if (DEBUG.enabled){
    if (DEBUG.selected){ deselectElement(DEBUG.selected); DEBUG.selected = null; }
    if (currentPageEl){
      currentPageEl.querySelectorAll('.asset, .txt, video').forEach(el => attachDraggable(el));
    }
    updatePanelInfo();
  }
}

btnCenter.addEventListener('click', function(){
  if (busy) return;
  const def = FLAT[cur].def;
  if (def.showCenter){
    setIcon(btnCenter, false);
    setTimeout(function(){ goNext(); }, 180);
  } else {
    goNext();
  }
});

function goNext(){
  if (busy) return;
  const pageEl = currentPageEl;
  if (pageEl && typeof pageEl._beforeNext === 'function'){
    busy = true;
    pageEl._beforeNext(function(t){
      busy = false;
      doNavigate(cur + 1, t || 'auto');
    });
    return;
  }
  if (pageEl && pageEl._nextType){ doNavigate(cur + 1, pageEl._nextType); return; }
  doNavigate(cur + 1, 'auto');
}
function goPrev(){
  if (busy) return;
  const def = FLAT[cur].def;
  if (def.leftAction === 'next'){ goNext(); return; }
  if (cur <= 0) return;
  doNavigate(cur - 1, 'auto');
}

btnLeft.addEventListener('click', goPrev);
btnRight.addEventListener('click', goNext);

document.addEventListener('click', function(e){
  const t = e.target;
  if (!t || !t.closest) return;
  if (t.closest('.navbtn') || t.closest('.clickable')){
    playClick();
  }
}, true);

document.addEventListener('keydown', function(e){
  if (DEBUG.enabled){
    if (!DEBUG.selected) return;
    const el = DEBUG.selected;
    const step = e.shiftKey ? 10 : 1;
    const curL = parseFloat(el.style.left) || 0;
    const curT = parseFloat(el.style.top)  || 0;
    let handled = true;
    if (e.key === 'ArrowLeft'){ el.style.left = (curL - step) + 'px'; }
    else if (e.key === 'ArrowRight'){ el.style.left = (curL + step) + 'px'; }
    else if (e.key === 'ArrowUp'){ el.style.top = (curT - step) + 'px'; }
    else if (e.key === 'ArrowDown'){ el.style.top = (curT + step) + 'px'; }
    else if (e.key === 'Delete' || e.key === 'Backspace'){
      const eid = el.dataset.eid;
      if (eid){ DEBUG.clearOne(eid); toast('已重置：' + eid); }
    } else handled = false;
    if (handled){
      e.preventDefault();
      updatePanelInfo();
      saveElement(el);
    }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ goNext(); }
  else if (e.key === 'ArrowLeft'){ goPrev(); }
});

window.addEventListener('wheel', function(e){
  const egg = document.getElementById('eggScroll');
  if (egg && egg.contains(e.target)) return;
  if (busy) return;
  if (DEBUG.enabled) return;
  if (e.deltaY > 40) goNext();
  else if (e.deltaY < -40) goPrev();
}, {passive:true});

function init(){
  resize();
  resetIcons();
  showCenter(false);
  showLR(true, true);
  cur = 0;
  buildAndPlace(0);
  const def = FLAT[0].def;
  showCenter(!!def.showCenter);
  if (def.showCenter){
    showLR(false, false);
    if (def.centerClosed) setIcon(btnCenter, true);
  }
}
init();

})();
</script>
